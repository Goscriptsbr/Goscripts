name: CI ping
on:
  push:
    branches: [sinucou-aab-src]
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir p && cd p && git init -q -b ping && date > t && git add t
          git -c user.email=a@b -c user.name=ci commit -qm ping
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:sinucou-ci-ping
