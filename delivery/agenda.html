<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Agendar horário · GoPedido</title>
<meta name="description" content="Veja os horários livres e marque seu horário online pelo GoPedido.">
<meta property="og:site_name" content="GoPedido">
<meta name="theme-color" content="#F2451C">
<link rel="icon" href="img/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icone-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=46863">
<style>
  body{padding-bottom:110px}
  .cover{height:200px;background:linear-gradient(135deg,var(--brand-soft),var(--brand)) center/cover;position:relative}
  .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35))}
  @media(max-width:600px){.cover{height:150px}}
  .head{position:relative;margin-top:-56px;z-index:2}
  .head .card{padding:20px;display:flex;gap:18px;align-items:flex-start}
  .head .lg{width:84px;height:84px;border-radius:22px;background:#fff center/cover;border:1px solid var(--line);flex:none;display:grid;place-items:center;font-size:2rem;font-weight:800;color:var(--brand)}
  @media(max-width:600px){.head .card{flex-direction:column;gap:12px}.head .lg{width:72px;height:72px;margin-top:-50px;box-shadow:0 6px 20px rgba(0,0,0,.12)}}
  .head h1{font-size:clamp(1.35rem,3vw,1.8rem);letter-spacing:-.03em;line-height:1.1}
  .head .desc{color:var(--ink-2);margin:6px 0 10px}
  .h-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .h-end{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;color:var(--ink-2);margin-top:10px}
  .h-end svg{flex:none;width:16px;height:16px;color:var(--muted);margin-top:2px}

  .ag-sec{margin-top:18px}
  .ag-sec>h2{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:800;letter-spacing:-.01em;margin:0 0 10px}
  .ag-sec>h2 .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.8rem;flex:none}
  .ag-sec.dis{opacity:.45;pointer-events:none}
  .serv{display:grid;gap:8px}
  .sv{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
  .sv .grow{min-width:0}
  .sv b{display:block;font-size:.98rem}
  .sv small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px;line-height:1.35}
  .sv .pr{font-weight:800;white-space:nowrap;text-align:right}
  .sv .pr small{font-weight:600}
  .sv.on{border-color:var(--brand);background:var(--brand-soft,#fff3ee);box-shadow:0 0 0 3px rgba(242,69,28,.12)}
  .profs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
  .profs::-webkit-scrollbar{display:none}
  .pf{flex:none;width:96px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1.5px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;font:inherit;color:inherit}
  .pf .av{width:52px;height:52px;border-radius:50%;background:var(--bg) center/cover;display:grid;place-items:center;font-weight:800;color:var(--brand);font-size:1.2rem}
  .pf .av svg{width:24px;height:24px}
  .pf span{font-size:.82rem;font-weight:700;text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .pf.on{border-color:var(--brand);background:var(--brand-soft,#fff3ee)}
  .dias{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
  .dias::-webkit-scrollbar{display:none}
  .dia{flex:none;width:64px;padding:10px 4px;border:1.5px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:inherit;scroll-snap-align:start}
  .dia small{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase}
  .dia b{font-size:1.25rem;line-height:1.1}
  .dia i{font-style:normal;font-size:.68rem;color:var(--muted)}
  .dia.on{border-color:var(--ink);background:var(--ink);color:#fff}.dia.on small,.dia.on i{color:#ffffffb3}
  .dia.off{opacity:.38;cursor:default}
  .mes{font-size:.82rem;font-weight:700;color:var(--muted);margin:-2px 0 8px}
  .horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
  .hr{padding:11px 4px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-weight:800;font-size:.95rem;cursor:pointer;color:inherit}
  .hr.on{border-color:var(--brand);background:var(--brand);color:#fff}
  .hgrupo{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px}
  .hgrupo:first-child{margin-top:0}
  .vazio{padding:18px;border-radius:14px;background:var(--bg);color:var(--ink-2);font-size:.9rem;text-align:center}
  .confbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.06)}
  .confbar .wrap{display:flex;gap:12px;align-items:center}
  .confbar .res{flex:1;min-width:0;font-size:.84rem;color:var(--ink-2);line-height:1.3}
  .confbar .res b{display:block;color:var(--ink);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* agendamento marcado */
  .tk{max-width:560px;margin:24px auto 0}
  .tk .st{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.82rem;padding:5px 12px;border-radius:999px}
  .tk .st.ok{background:#e7f6ec;color:#166534}.tk .st.no{background:#fdecea;color:#8a1c12}.tk .st.fim{background:var(--bg);color:var(--ink-2)}
  .tk .quando{background:var(--bg);border-radius:18px;padding:18px;margin:14px 0}
  .tk .quando small{color:var(--muted);font-weight:700}
  .tk .quando .h{font-size:2.2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0 10px}
  .tk .linha{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;padding:4px 0}
  .tk .acts{display:grid;gap:8px;margin-top:14px}
  .alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:.9rem;line-height:1.45}
  .alert svg{flex:none;width:18px;height:18px;margin-top:1px}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="icon-btn" href="./" id="b-back" aria-label="Voltar"></a>
    <a class="logo" href="./"><b id="lg"></b><span>Go<em>Pedido</em></span></a>
    <div class="grow"></div>
    <a class="icon-btn" href="conta.html" id="b-conta" aria-label="Minha conta"></a>
  </div>
</header>
<div id="page"><div class="wrap"><div class="sk" style="height:200px;margin-top:20px;border-radius:20px"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=32758"></script>
<script src="app.js?v=43772"></script>
<script>
(async () => {
  const { $, esc, brl, ic } = GP;
  const sb = GP.client('cliente');
  $('lg').innerHTML = ic('bag'); $('b-back').innerHTML = ic('left'); $('b-conta').innerHTML = ic('user');
  const qs = new URLSearchParams(location.search);
  const fail = (t, d) => { $('page').innerHTML = `<div class="wrap"><div class="empty" style="padding-top:90px"><div class="big">${ic('calendar')}</div><h4>${t}</h4><p>${d}</p><a class="btn btn-primary" href="./" style="margin-top:18px">Ver outras lojas</a></div></div>`; };
  const dur = (m) => m >= 60 ? Math.floor(m / 60) + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : '') : m + ' min';
  const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);

  // ================= Página do horário marcado (?t=token) =================
  if (qs.get('t')) return verAgendamento(qs.get('t'));

  // ================= Agendar (?l=slug) =================
  const slug = qs.get('l');
  if (!slug) return fail('Estabelecimento não informado', 'Abra pela página inicial.');
  const { data: loja, error } = await sb.from('ff_lojas').select('*').eq('slug', slug).eq('ativa', true).maybeSingle();
  if (error) return fail('Não foi possível abrir', esc(GP.err(error)));
  if (!loja) return fail('Estabelecimento não encontrado', 'O link pode estar errado ou saiu do ar.');
  if (loja.tipo !== 'agenda') { location.replace('loja.html?l=' + encodeURIComponent(slug)); return; }
  GP.aplicarCor(loja.cor);
  document.title = `Agendar · ${loja.nome} · GoPedido`;
  const [{ data: servs }, { data: profs0 }] = await Promise.all([
    sb.from('ff_servicos').select('*').eq('loja_id', loja.id).eq('ativo', true).order('ordem').order('nome'),
    sb.from('ff_profissionais').select('id,nome,foto_url,horarios,servicos,ordem').eq('loja_id', loja.id).eq('ativo', true).order('ordem').order('nome')
  ]);
  const profs = profs0 || [];
  const cli = GP.ls.get('gp_cliente', {});
  const passo = Number(loja.ag_intervalo) || 30, diasMax = Number(loja.ag_dias) || 30, antec = Number(loja.ag_antecedencia) || 0;

  $('page').innerHTML = `
    <div class="cover" id="cover"></div>
    <div class="wrap head"><div class="card">
      <div class="lg" id="s-logo"></div>
      <div class="grow" style="min-width:0">
        <h1>${esc(loja.nome)}${loja.verificacao === 'verificada' ? ` <span class="verif" title="Verificado pelo GoPedido">${ic('check')}Verificada</span>` : ''}</h1>
        <p class="desc">${esc(loja.descricao || 'Agende seu horário online.')}</p>
        ${loja.endereco ? `<div class="h-end">${ic('pin')}<span>${esc(loja.endereco)}</span></div>` : ''}
        <div class="h-acts">
          ${loja.lat != null ? `<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="${GP.mapsLink(loja.lat, loja.lng)}">${ic('ext')}Ver no mapa</a>` : ''}
          ${loja.telefone ? `<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="${GP.wa(loja.telefone, 'Olá! Vim pelo GoPedido.')}">${ic('chat')}WhatsApp</a>` : ''}
        </div>
        ${loja.verificacao !== 'verificada' ? `<div class="alert off" style="margin-top:12px;background:var(--warn-soft);color:#7a4f0e">${ic('shield')}<span>Este estabelecimento está em análise e ainda não recebe agendamentos.</span></div>` : ''}
      </div></div></div>
    <main class="wrap">
      <section class="ag-sec" id="sec-serv"><h2><span class="n">1</span>Escolha o serviço</h2><div class="serv" id="serv"></div></section>
      <section class="ag-sec dis" id="sec-prof"><h2><span class="n">2</span>Com quem?</h2><div class="profs" id="profs"></div></section>
      <section class="ag-sec dis" id="sec-dia"><h2><span class="n">3</span>Escolha o dia</h2><div class="mes" id="mes"></div><div class="dias" id="dias"></div></section>
      <section class="ag-sec dis" id="sec-hora"><h2><span class="n">4</span>Horários livres</h2><div id="horas"></div></section>
      <section class="ag-sec dis" id="sec-dados"><h2><span class="n">5</span>Seus dados</h2>
        <div class="card pad">
          <div class="grid2">
            <label class="field"><span>Seu nome</span><input class="input" id="c-nome" maxlength="80" autocomplete="name" placeholder="Nome e sobrenome"></label>
            <label class="field"><span>WhatsApp</span><input class="input" id="c-tel" inputmode="tel" maxlength="16" autocomplete="tel" placeholder="(19) 99999-9999"></label>
          </div>
          <label class="field"><span>E-mail <span class="muted">(a confirmação e o lembrete 3 h antes chegam por aqui)</span></span><input class="input" id="c-email" type="email" maxlength="120" autocomplete="email" placeholder="voce@email.com"></label>
          <label class="field" style="margin-bottom:0"><span>Observação <span class="muted">(opcional)</span></span><input class="input" id="c-obs" maxlength="300" placeholder="Ex.: corte degradê, unha em gel…"></label>
        </div>
      </section>
    </main>
    <div class="confbar"><div class="wrap"><div class="res" id="res"><b>Escolha um serviço</b>para ver os horários</div><button class="btn btn-primary" id="b-conf" disabled>Confirmar</button></div></div>`;
  if (loja.capa_url || loja.imagem_url) $('cover').style.backgroundImage = `url('${loja.capa_url || loja.imagem_url}')`;
  if (loja.imagem_url) $('s-logo').style.backgroundImage = `url('${loja.imagem_url}')`; else $('s-logo').textContent = loja.nome.trim()[0].toUpperCase();
  $('c-nome').value = cli.nome || ''; $('c-tel').value = cli.telefone || ''; $('c-email').value = cli.email || '';
  GP.phoneMask($('c-tel'));
  try { const { data: { session } } = await sb.auth.getSession(); if (session && session.user) {
    if (!$('c-email').value) $('c-email').value = session.user.email || '';
    const { data: pf } = await sb.from('ff_clientes').select('nome,telefone').eq('id', session.user.id).maybeSingle();
    if (pf) { if (pf.nome && !$('c-nome').value) $('c-nome').value = pf.nome; if (pf.telefone && !$('c-tel').value) $('c-tel').value = pf.telefone; }
  } } catch {}

  let sv = null, pfSel = '', dia = null, slot = null;   // pfSel: '' = qualquer um
  const ocup = {};   // dia → lista de ocupados
  const hojeSP = GP.dataSP();
  const somaDia = (d, n) => { const x = new Date(d + 'T12:00:00-03:00'); x.setUTCDate(x.getUTCDate() + n); return GP.dataSP(x); };
  const dias = Array.from({ length: diasMax + 1 }, (_, i) => somaDia(hojeSP, i));

  // 1) serviços
  if (!(servs || []).length || !profs.length) {
    $('serv').innerHTML = `<div class="vazio">Este estabelecimento ainda não abriu a agenda online.${loja.telefone ? ` <a href="${GP.wa(loja.telefone, 'Olá! Gostaria de marcar um horário.')}" target="_blank" rel="noopener" style="font-weight:800;color:var(--brand-2)">Chamar no WhatsApp</a>` : ''}</div>`;
    return;
  }
  $('serv').innerHTML = servs.map(s => `<button type="button" class="sv" data-s="${s.id}">
      <span class="grow"><b>${esc(s.nome)}</b><small>${ic('clock', 'style="width:13px;height:13px;vertical-align:-2px"')} ${dur(s.duracao_min)}${s.descricao ? ' · ' + esc(s.descricao) : ''}</small></span>
      <span class="pr">${Number(s.preco) ? (s.preco_a_partir ? '<small>a partir de</small><br>' : '') + brl(s.preco) : '<small>a combinar</small>'}</span></button>`).join('');
  $('serv').onclick = (e) => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    sv = servs.find(x => x.id === b.dataset.s); slot = null;
    document.querySelectorAll('.sv').forEach(x => x.classList.toggle('on', x === b));
    const fazem = profsDoServ();
    if (pfSel && !fazem.some(p => p.id === pfSel)) pfSel = '';
    renderProfs(); renderDias(); $('sec-prof').classList.remove('dis'); $('sec-dia').classList.remove('dis');
    setTimeout(() => $(fazem.length > 1 ? 'sec-prof' : 'sec-dia').scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
    renderRes();
  };
  const profsDoServ = () => profs.filter(p => !(p.servicos || []).length || p.servicos.includes(sv.id));

  // 2) profissional
  function renderProfs() {
    const fazem = profsDoServ();
    $('sec-prof').classList.toggle('hide', fazem.length < 2);
    if (fazem.length === 1) pfSel = fazem[0].id;
    $('profs').innerHTML = (fazem.length > 1 ? `<button type="button" class="pf ${pfSel === '' ? 'on' : ''}" data-p=""><span class="av">${ic('user')}</span><span>Qualquer um</span></button>` : '')
      + fazem.map(p => `<button type="button" class="pf ${pfSel === p.id ? 'on' : ''}" data-p="${p.id}"><span class="av" style="${p.foto_url ? `background-image:url('${esc(p.foto_url)}')` : ''}">${p.foto_url ? '' : esc(p.nome.trim()[0].toUpperCase())}</span><span>${esc(p.nome)}</span></button>`).join('');
  }
  $('profs').onclick = (e) => { const b = e.target.closest('[data-p]'); if (!b) return; pfSel = b.dataset.p; slot = null; renderProfs(); renderDias(); renderRes(); };

  // 3) dias (marca os dias sem expediente)
  const trabalha = (d) => {
    const dow = new Date(d + 'T12:00:00-03:00').getUTCDay();
    return profsDoServ().filter(p => !pfSel || p.id === pfSel).some(p => { const h = (p.horarios || {})[dow]; return h && h.aberto; });
  };
  function renderDias() {
    if (!dia || !trabalha(dia)) dia = dias.find(trabalha) || null;
    const meses = new Set();
    $('dias').innerHTML = dias.map((d, i) => {
      const ok = trabalha(d), dt = new Date(d + 'T12:00:00-03:00');
      meses.add(GP.diaSP(dt, { month: 'long' }));
      return `<button type="button" class="dia ${d === dia ? 'on' : ''} ${ok ? '' : 'off'}" data-d="${d}" ${ok ? '' : 'disabled'}>
        <small>${i === 0 ? 'Hoje' : i === 1 ? 'Amanhã' : GP.diaSP(dt, { weekday: 'short' }).replace('.', '')}</small><b>${dt.getUTCDate()}</b><i>${GP.diaSP(dt, { month: 'short' }).replace('.', '')}</i></button>`;
    }).join('');
    $('mes').textContent = dia ? cap(GP.diaSP(new Date(dia + 'T12:00:00-03:00'), { weekday: 'long', day: 'numeric', month: 'long' })) : '';
    renderHoras();
  }
  $('dias').onclick = (e) => { const b = e.target.closest('[data-d]'); if (!b || b.disabled) return; dia = b.dataset.d; slot = null; renderDias(); renderRes(); setTimeout(() => $('sec-hora').scrollIntoView({ behavior: 'smooth', block: 'start' }), 60); };

  // 4) horários livres
  let horasSeq = 0;
  async function renderHoras() {
    $('sec-hora').classList.toggle('dis', !dia);
    if (!dia) { $('horas').innerHTML = '<div class="vazio">Nenhum dia com atendimento nos próximos dias.</div>'; return; }
    const my = ++horasSeq;
    if (!ocup[dia]) {
      $('horas').innerHTML = '<div class="horas">' + Array(8).fill('<div class="sk" style="height:44px;border-radius:12px"></div>').join('') + '</div>';
      const { data, error: er } = await sb.rpc('ff_agenda_ocupado', { p_loja: loja.id, p_de: dia, p_dias: 1 });
      if (er) { $('horas').innerHTML = `<div class="vazio">${esc(GP.err(er))}</div>`; return; }
      ocup[dia] = data || [];
    }
    if (my !== horasSeq) return;
    const minIni = new Date(Date.now() + antec * 60000);
    const lista = profsDoServ().filter(p => !pfSel || p.id === pfSel);
    const mapa = new Map();   // minuto → [profissionais livres]
    lista.forEach(p => GP.slotsProf(p, dia, sv.duracao_min, passo, ocup[dia], minIni).forEach(s => { if (!mapa.has(s.min)) mapa.set(s.min, []); mapa.get(s.min).push(p.id); }));
    const mins = [...mapa.keys()].sort((a, b) => a - b);
    if (!mins.length) { $('horas').innerHTML = `<div class="vazio">Sem horários livres neste dia${pfSel ? ' com essa pessoa' : ''}. Escolha outro dia${pfSel && profsDoServ().length > 1 ? ' ou "Qualquer um"' : ''}.</div>`; return; }
    const hm = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    const grupos = [['Manhã', 0, 720], ['Tarde', 720, 1080], ['Noite', 1080, 1441]];
    $('horas').innerHTML = grupos.map(([g, a, b]) => {
      const gm = mins.filter(m => m >= a && m < b); if (!gm.length) return '';
      return `<div class="hgrupo">${g}</div><div class="horas">${gm.map(m => `<button type="button" class="hr ${slot && slot.min === m && slot.dia === dia ? 'on' : ''}" data-m="${m}">${hm(m)}</button>`).join('')}</div>`;
    }).join('');
    $('horas').onclick = (e) => {
      const b = e.target.closest('[data-m]'); if (!b) return;
      const m = Number(b.dataset.m);
      slot = { dia, min: m, ini: GP.emSP(dia, m), prof: pfSel || null, livres: mapa.get(m) };
      document.querySelectorAll('.hr').forEach(x => x.classList.toggle('on', x === b));
      $('sec-dados').classList.remove('dis'); renderRes();
      if (!$('c-nome').value.trim() || !$('c-tel').value.trim()) setTimeout(() => $('sec-dados').scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
    };
  }

  // resumo + confirmar
  const dadosOk = () => $('c-nome').value.trim().length >= 2 && GP.digits($('c-tel').value).length >= 10 && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($('c-email').value.trim());
  function renderRes() {
    if (!sv) { $('res').innerHTML = '<b>Escolha um serviço</b>para ver os horários'; $('b-conf').disabled = true; return; }
    if (!slot) { $('res').innerHTML = `<b>${esc(sv.nome)}</b>Escolha o dia e o horário`; $('b-conf').disabled = true; return; }
    const p = slot.prof ? profs.find(x => x.id === slot.prof) : null;
    $('res').innerHTML = `<b>${cap(GP.diaSP(slot.ini, { weekday: 'short', day: '2-digit', month: '2-digit' }).replace('.', ''))} às ${GP.horaSP(slot.ini)}</b>${esc(sv.nome)}${p ? ' · ' + esc(p.nome) : ''}${Number(sv.preco) ? ' · ' + brl(sv.preco) : ''}`;
    $('b-conf').disabled = !dadosOk() || loja.verificacao !== 'verificada';
    $('b-conf').textContent = dadosOk() ? 'Confirmar' : ($('c-nome').value.trim() && GP.digits($('c-tel').value).length >= 10 ? 'Falta o e-mail' : 'Preencha seus dados');
  }
  ['c-nome', 'c-tel', 'c-email'].forEach(id => $(id).addEventListener('input', renderRes));

  $('b-conf').onclick = async () => {
    if (!slot || !dadosOk()) return;
    const b = $('b-conf'); b.disabled = true; b.innerHTML = '<span class="spin"></span>Marcando…';
    const cliente = { nome: $('c-nome').value.trim(), telefone: $('c-tel').value.trim(), email: $('c-email').value.trim(), obs: $('c-obs').value.trim() };
    const { data, error: er } = await sb.rpc('ff_agendar', { p_loja: loja.id, p_servico: sv.id, p_profissional: slot.prof, p_inicio: slot.ini.toISOString(), p_cliente: cliente });
    if (er) {
      GP.toast(GP.err(er), 'err');
      if (/horario_ocupado|horario_passou/.test(er.message || '')) { delete ocup[slot.dia]; slot = null; renderHoras(); }
      b.textContent = 'Confirmar'; renderRes(); return;
    }
    GP.ls.set('gp_cliente', { ...GP.ls.get('gp_cliente', {}), nome: cliente.nome, telefone: cliente.telefone, email: cliente.email });
    sb.functions.invoke('ff-email', { body: { agendamento: data.token, tipo: 'ag_novo' } }).catch(() => {});
    location.href = 'agenda.html?t=' + encodeURIComponent(data.token) + '&novo=1';
  };

  // ================= Ver / cancelar um horário =================
  async function verAgendamento(token) {
    const { data: a, error: er } = await sb.rpc('ff_ver_agendamento', { p_token: token });
    if (er) return fail('Não foi possível abrir', esc(GP.err(er)));
    if (!a) return fail('Horário não encontrado', 'O link pode estar errado.');
    const l = a.loja || {};
    document.title = `Meu horário · ${l.nome} · GoPedido`;
    const passou = new Date(a.fim) < new Date();
    const st = a.status === 'cancelado' ? ['no', a.cancelado_por === 'cliente' ? 'Cancelado por você' : 'Cancelado pelo estabelecimento']
      : a.status === 'concluido' ? ['fim', 'Atendimento concluído'] : a.status === 'faltou' ? ['no', 'Não compareceu']
      : passou ? ['fim', 'Horário já passou'] : ['ok', 'Horário confirmado'];
    const ics = () => {
      const f = (d) => new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
      const txt = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//GoPedido//Agenda//PT', 'BEGIN:VEVENT', 'UID:' + token + '@gopedido',
        'DTSTAMP:' + f(new Date()), 'DTSTART:' + f(a.inicio), 'DTEND:' + f(a.fim), 'SUMMARY:' + a.servico + ' · ' + l.nome,
        'LOCATION:' + String(l.endereco || '').replace(/[,;]/g, ' '), 'DESCRIPTION:Com ' + a.profissional, 'BEGIN:VALARM', 'TRIGGER:-PT3H', 'ACTION:DISPLAY', 'DESCRIPTION:Lembrete', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
      return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(txt);
    };
    const gcal = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(a.servico + ' · ' + l.nome)
      + '&dates=' + new Date(a.inicio).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '') + '/' + new Date(a.fim).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '')
      + '&location=' + encodeURIComponent(l.endereco || '');
    const ativo = a.status === 'agendado' && !passou;
    $('page').innerHTML = `<div class="wrap"><div class="tk">
      ${qs.get('novo') && ativo ? `<div class="alert" style="background:#e7f6ec;color:#166534;margin-bottom:12px">${ic('check')}<span><b>Horário marcado!</b> ${a.cliente_nome ? esc(a.cliente_nome.split(' ')[0]) + ', ' : ''}guarde esta página. A confirmação já está a caminho do seu e-mail.</span></div>` : ''}
      <div class="card pad">
        <div class="row between" style="gap:10px;align-items:flex-start"><div><div class="small muted">${esc(l.nome)}</div><h1 style="font-size:1.35rem;letter-spacing:-.02em">Horário #${a.numero}</h1></div><span class="st ${st[0]}">${st[1]}</span></div>
        <div class="quando"><small>${cap(GP.diaSP(a.inicio))}</small><div class="h">${GP.horaSP(a.inicio)}</div>
          <div class="linha"><span>Serviço</span><b>${esc(a.servico)}</b></div>
          <div class="linha"><span>Com</span><b>${esc(a.profissional)}</b></div>
          <div class="linha"><span>Duração</span><b>${dur(a.duracao)}</b></div>
          ${Number(a.preco) ? `<div class="linha"><span>Valor</span><b>${brl(a.preco)}</b></div>` : ''}
          ${a.observacao ? `<div class="linha"><span>Observação</span><b style="text-align:right">${esc(a.observacao)}</b></div>` : ''}
        </div>
        ${l.endereco ? `<div class="h-end">${ic('pin')}<span>${esc(l.endereco)}</span></div>` : ''}
        <div class="acts">
          ${ativo ? `<a class="btn btn-dark btn-block" href="${gcal}" target="_blank" rel="noopener">${ic('calendar')}Adicionar ao Google Agenda</a>
                     <a class="btn btn-ghost btn-block" href="${ics()}" download="horario-${a.numero}.ics">${ic('calendar')}Adicionar ao calendário do celular</a>` : ''}
          ${l.lat != null && ativo ? `<a class="btn btn-ghost btn-block" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}">${ic('pin')}Como chegar</a>` : ''}
          ${l.telefone ? `<a class="btn btn-ghost btn-block" target="_blank" rel="noopener" href="${GP.wa(l.telefone, 'Olá! Sobre o meu horário #' + a.numero + ' (' + a.servico + ', ' + GP.diaSP(a.inicio, { day: '2-digit', month: '2-digit' }) + ' às ' + GP.horaSP(a.inicio) + ') pelo GoPedido.')}">${ic('chat')}Falar no WhatsApp</a>` : ''}
          ${a.pode_cancelar ? `<button class="btn btn-ghost btn-block" id="b-cancel" style="color:var(--danger,#c0362c)">${ic('x')}Cancelar horário</button>`
            : ativo && a.cancelar_h ? `<p class="small muted center" style="margin:4px 0 0">Para cancelar com menos de ${a.cancelar_h} h de antecedência, fale com o estabelecimento.</p>` : ''}
          ${l.slug ? `<a class="btn ${ativo ? 'btn-ghost' : 'btn-primary'} btn-block" href="agenda.html?l=${encodeURIComponent(l.slug)}">${ic('plus')}Marcar outro horário</a>` : ''}
        </div>
      </div></div></div>`;
      if ($('b-cancel')) $('b-cancel').onclick = async () => {
      if (!(await GP.confirmar('Cancelar este horário?', { texto: `${a.servico}, ${GP.diaSP(a.inicio)} às ${GP.horaSP(a.inicio)}. O horário fica livre para outra pessoa.`, ok: 'Cancelar horário', perigo: true }))) return;
      const { error: e2 } = await sb.rpc('ff_cancelar_agendamento', { p_token: token });
      if (e2) return GP.toast(GP.err(e2), 'err');
      sb.functions.invoke('ff-email', { body: { agendamento: token, tipo: 'ag_cancelado' } }).catch(() => {});
      GP.toast('Horário cancelado.', 'ok'); history.replaceState(null, '', 'agenda.html?t=' + encodeURIComponent(token)); verAgendamento(token);
    };
  }
})();
</script>
</body>
</html>
