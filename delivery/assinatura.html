<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Assinatura · GoPedido</title>
<meta name="description" content="Assine os planos da loja pelo GoPedido: pague pelo Pix ou cartão e receba o aviso antes de vencer.">
<meta property="og:site_name" content="GoPedido">
<meta name="theme-color" content="#F2451C">
<link rel="icon" href="img/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icone-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=46863">
<style>
  body{padding-bottom:60px}
  .cover{height:190px;background:linear-gradient(135deg,var(--brand-soft),var(--brand)) center/cover;position:relative}
  .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35))}
  @media(max-width:600px){.cover{height:140px}}
  .head{position:relative;margin-top:-56px;z-index:2}
  .head .card{padding:20px;display:flex;gap:18px;align-items:flex-start}
  .head .lg{width:84px;height:84px;border-radius:22px;background:#fff center/cover;border:1px solid var(--line);flex:none;display:grid;place-items:center;font-size:2rem;font-weight:800;color:var(--brand)}
  @media(max-width:600px){.head .card{flex-direction:column;gap:12px}.head .lg{width:72px;height:72px;margin-top:-50px;box-shadow:0 6px 20px rgba(0,0,0,.12)}}
  .head h1{font-size:clamp(1.35rem,3vw,1.8rem);letter-spacing:-.03em;line-height:1.1}
  .head .desc{color:var(--ink-2);margin:6px 0 10px}
  .sec{margin-top:18px}
  .sec>h2{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:800;margin:0 0 10px}
  .sec>h2 .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.8rem;flex:none}
  .planos{display:grid;gap:10px}
  .pl{display:block;text-align:left;width:100%;font:inherit;color:inherit;padding:16px;border:1.5px solid var(--line);border-radius:18px;background:#fff;cursor:pointer}
  .pl b{display:block;font-size:1.05rem}
  .pl p{margin:4px 0 8px;color:var(--ink-2);font-size:.88rem;line-height:1.45;white-space:pre-line}
  .pl .de{font-weight:800}.pl .de small{font-weight:600;color:var(--muted)}
  .pl .tag{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:800;color:var(--brand-2);background:var(--brand-soft);padding:3px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
  .pl .tag svg{width:12px;height:12px}
  .pl.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(242,69,28,.12)}
  .pers{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
  .per{border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:inherit;color:inherit}
  .per b{font-size:.9rem}.per .v{font-size:1.1rem;font-weight:800}.per small{font-size:.72rem;color:var(--ok,#14945A);font-weight:700;text-align:center}
  .per.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(242,69,28,.12)}
  .abas{display:grid;grid-template-columns:1fr 1fr;background:#ECEAE6;border-radius:12px;padding:3px;margin:14px 0 12px}
  .abas button{height:40px;border-radius:9px;font-weight:700;font-size:.9rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
  .abas button svg{width:17px;height:17px}
  .abas button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .pixqr{display:flex;justify-content:center}.pixqr img{width:210px;height:210px;border-radius:12px;border:1px solid var(--line)}
  .stat{display:flex;gap:12px;align-items:center;padding:16px;border-radius:18px;background:var(--bg);margin-bottom:12px}
  .stat .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
  .stat .ic svg{width:22px;height:22px}
  .stat.ok .ic{background:#e7f6ec;color:#166534}.stat.ven .ic{background:#fdecea;color:#8a1c12}.stat.pen .ic{background:var(--warn-soft);color:#7a4f0e}
  .stat b{display:block;font-size:1rem}.stat span{font-size:.86rem;color:var(--ink-2)}
  .res{display:flex;justify-content:space-between;gap:10px;align-items:baseline;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:.9rem}
  .res b{font-size:1.15rem}
  .hist{margin-top:16px;font-size:.84rem}
  .hist div{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
  .hist .aprovado{color:#166534}.hist .pendente{color:#7a4f0e}.hist .recusado,.hist .estornado{color:#8a1c12}.hist .expirado{color:var(--muted)}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="icon-btn" href="./" id="b-back" aria-label="Voltar"></a>
    <a class="logo" href="./"><b id="lg"></b><span>Go<em>Pedido</em></span></a>
    <div class="grow"></div>
  </div>
</header>
<div id="page"><div class="wrap"><div class="sk" style="height:200px;margin-top:20px;border-radius:20px"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=32758"></script>
<script src="app.js?v=48334"></script>
<script>
(async () => {
  const { $, esc, brl, ic } = GP;
  const sb = GP.client(false);
  $('lg').innerHTML = ic('bag'); $('b-back').innerHTML = ic('left');
  const qs = new URLSearchParams(location.search);
  const PER = [1, 3, 6, 12];
  const nomePer = (m) => m === 12 ? '1 ano' : m + (m > 1 ? ' meses' : ' mês');
  const dataBR = (d) => d ? String(d).slice(0, 10).split('-').reverse().join('/') : '';
  const hoje = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
  const fail = (t, d) => { $('page').innerHTML = `<div class="wrap"><div class="empty" style="padding-top:90px"><div class="big">${ic('star')}</div><h4>${t}</h4><p>${d}</p><a class="btn btn-primary" href="./" style="margin-top:18px">Ver outras lojas</a></div></div>`; };
  async function chamar(body) {
    const { data, error } = await sb.functions.invoke('ff-mercadopago', { body });
    if (error) {
      let j = null; try { j = error.context && await error.context.json(); } catch (_) {}
      const cod = (j && j.error) || '';
      const msg = cod === 'mp_desconectado' ? 'Esta loja ainda não ligou o pagamento online. Fale com ela pelo WhatsApp.'
        : cod === 'loja_bloqueada_plano' ? 'Esta loja está temporariamente indisponível.' : cod === 'mp_erro' && j.detalhe ? 'Mercado Pago: ' + j.detalhe : GP.err(new Error(cod || (error.message || 'erro')));
      throw new Error(msg);
    }
    return data;
  }
  const precosDe = (p) => PER.filter(m => Number((p.precos || {})[m]) > 0).map(m => ({ m, v: Number(p.precos[m]) }));
  const menorMes = (p) => Math.min(...precosDe(p).map(x => x.v / x.m));
  function cabecalho(l, desc) {
    return `<div class="cover" id="cover"></div>
      <div class="wrap head"><div class="card">
        <div class="lg" id="s-logo"></div>
        <div class="grow" style="min-width:0">
          <h1>${esc(l.nome)}</h1>
          <p class="desc">${esc(desc || '')}</p>
          ${l.telefone ? `<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="${GP.wa(l.telefone, 'Olá! Vim pelo GoPedido, sobre a assinatura.')}">${ic('chat')}WhatsApp da loja</a>` : ''}
        </div></div></div>`;
  }
  function fotos(l) {
    if (l.capa_url || l.imagem_url) $('cover').style.backgroundImage = `url('${l.capa_url || l.imagem_url}')`;
    if (l.imagem_url) $('s-logo').style.backgroundImage = `url('${l.imagem_url}')`; else $('s-logo').textContent = l.nome.trim()[0].toUpperCase();
  }
  function cardPlano(p, on) {
    const ps = precosDe(p), mm = menorMes(p);
    return `<button type="button" class="pl ${on ? 'on' : ''}" data-pl="${p.id}"><b>${esc(p.nome)}${p.entrega_codigo ? `<span class="tag">${ic('bolt')}código na hora</span>` : ''}</b>
      ${p.descricao ? `<p>${esc(p.descricao)}</p>` : ''}
      <span class="de">${ps.length > 1 ? '<small>a partir de </small>' : ''}${brl(mm)}<small>/mês</small></span>${ps.length > 1 ? ` <small class="muted">· ${ps.map(x => nomePer(x.m)).join(', ')}</small>` : ` <small class="muted">· ${nomePer(ps[0].m)}</small>`}</button>`;
  }
  function cardPeriodos(p, sel) {
    const ps = precosDe(p), base = ps.find(x => x.m === 1);
    return ps.map(x => {
      const eco = base && x.m > 1 ? Math.round(base.v * x.m - x.v) : 0;
      return `<button type="button" class="per ${sel === x.m ? 'on' : ''}" data-m="${x.m}"><b>${nomePer(x.m)}</b><span class="v">${brl(x.v)}</span><small>${eco > 0 ? 'economize ' + brl(eco) : x.m > 1 ? brl(x.v / x.m) + '/mês' : ''}</small></button>`;
    }).join('');
  }

  // ===================== Pagamento (Pix ou cartão) =====================
  let poll = null, brick = null;
  function areaPagamento(el, ctx) {
    // ctx: { token, plano, meses, valor, email, public_key, aoPagar }
    let aba = 'pix';
    const desenhar = () => {
      clearInterval(poll); try { brick && brick.unmount && brick.unmount(); } catch (_) {} brick = null;
      el.innerHTML = `<div class="abas"><button type="button" data-ab="pix" class="${aba === 'pix' ? 'on' : ''}">${ic('pix')}Pix</button><button type="button" data-ab="cartao" class="${aba === 'cartao' ? 'on' : ''}">${ic('card')}Cartão</button></div><div id="pg-area"></div><p class="small muted center" style="margin:10px 0 0">${ic('lock')} Pagamento direto no Mercado Pago da loja. O GoPedido não vê nem guarda os dados do seu cartão.</p>`;
      el.querySelector('.abas').onclick = (e) => { const b = e.target.closest('[data-ab]'); if (b) { aba = b.dataset.ab; desenhar(); } };
      (aba === 'pix' ? pix : cartao)($('pg-area'));
    };
    const ok = (r) => { clearInterval(poll); ctx.aoPagar(r); };
    function pix(box) {
      box.innerHTML = `<button type="button" class="btn btn-primary btn-block" id="pg-gerar">${ic('pix')}Gerar Pix de ${brl(ctx.valor)}</button>`;
      $('pg-gerar').onclick = async (e) => {
        const b = e.currentTarget; b.disabled = true; b.innerHTML = '<span class="spin"></span>Gerando…';
        try {
          const r = await chamar({ acao: 'assin_pix', token: ctx.token, plano: ctx.plano, meses: ctx.meses });
          if (r.pago) return ok(r);
          box.innerHTML = `<div class="pixqr">${r.qr_img ? `<img alt="QR Code do Pix" src="data:image/png;base64,${r.qr_img}">` : ''}</div>
            <p class="small center" style="margin:8px 0">Abra o app do banco, escolha <b>Pix → Ler QR Code</b> ou use o copia e cola:</p>
            <div class="row" style="gap:6px"><input class="input" readonly value="${esc(r.qr)}"><button type="button" class="btn btn-dark btn-sm" id="pg-cp">${ic('copy')}Copiar</button></div>
            <p class="small muted center" style="margin-top:10px"><span class="dot-live"></span> Esperando o pagamento… confirma sozinho. O Pix vale 30 minutos.</p>`;
          $('pg-cp').onclick = () => GP.copy(r.qr, 'Código Pix copiado');
          poll = setInterval(async () => { try { const c = await chamar({ acao: 'assin_conferir', id: r.id }); if (c.status === 'aprovado') ok(c); } catch (_) {} }, 5000);
        } catch (er) { b.disabled = false; b.innerHTML = ic('pix') + 'Gerar Pix de ' + brl(ctx.valor); GP.toast(er.message, 'err'); }
      };
    }
    async function cartao(box) {
      box.innerHTML = `<div id="pg-card"><p class="small muted center" style="padding:20px 0"><span class="spin"></span> Carregando o formulário seguro do Mercado Pago…</p></div>
        `;
      try {
        if (!ctx.public_key) throw new Error('chave');
        if (!window.MercadoPago) await new Promise((r, f) => { const s = document.createElement('script'); s.src = 'https://sdk.mercadopago.com/js/v2'; s.onload = r; s.onerror = f; document.head.appendChild(s); });
        const mpx = new window.MercadoPago(ctx.public_key, { locale: 'pt-BR' });
        $('pg-card').innerHTML = '';
        brick = await mpx.bricks().create('cardPayment', 'pg-card', {
          initialization: { amount: Number(ctx.valor), payer: { email: ctx.email } },
          customization: { paymentMethods: { maxInstallments: Math.min(12, ctx.meses), types: { excluded: ['debit_card', 'prepaid_card'] } }, visual: { style: { customVariables: { baseColor: getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#F2451C' } } } },
          callbacks: { onReady: () => {}, onError: () => {}, onSubmit: async (dados) => {
            const r = await chamar({ acao: 'assin_cartao', token: ctx.token, plano: ctx.plano, meses: ctx.meses, dados }).catch(er => ({ erro: er.message }));
            if (r.status === 'aprovado') return ok(r);
            if (r.status === 'pendente') { GP.toast('Pagamento em análise. A assinatura ativa assim que o Mercado Pago aprovar.'); return; }
            GP.toast(r.erro || 'O cartão não foi aprovado. Tente outro cartão ou o Pix.', 'err'); throw new Error('recusado');
          } }
        });
      } catch (_) { box.innerHTML = '<div class="warnline">Não foi possível abrir o cartão agora. Use o Pix ou tente de novo em instantes.</div>'; }
    }
    desenhar();
  }
  function telaPago(r, extra) {
    clearInterval(poll);
    $('pg').innerHTML = `<div class="center" style="padding:6px 0">
      <div class="cfm-ic" style="background:#e7f6ec;color:#166534;margin:0 auto 10px">${ic('check')}</div>
      <h3 style="margin:0 0 6px">Pagamento confirmado!</h3>
      <p class="small muted" style="margin:0 0 10px">Sua assinatura vale até <b>${dataBR(r.valido_ate)}</b>. ${extra || ''}Mandamos a confirmação para o seu e-mail${extra ? ', com o código' : ''}. Antes de vencer, avisamos com o link para renovar.</p></div>`;
    window.scrollTo({ top: $('pg').getBoundingClientRect().top + scrollY - 90, behavior: 'smooth' });
  }

  // ===================== Minha assinatura (?t=token) =====================
  if (qs.get('t')) {
    let info;
    try { info = await chamar({ acao: 'assin_info', token: qs.get('t') }); } catch (er) { return fail('Assinatura não encontrada', esc(er.message)); }
    const { assinante: a, loja: l } = info;
    GP.aplicarCor(l.cor); document.title = `Minha assinatura · ${l.nome} · GoPedido`;
    let plano = info.planos.find(p => p.id === a.plano_id) || info.planos[0];
    if (!plano) return fail('Plano indisponível', 'Esta loja não tem planos disponíveis agora. Fale com ela pelo WhatsApp.');
    let meses = precosDe(plano)[0].m;
    const venc = a.status === 'ativo' && a.valido_ate && a.valido_ate < hoje();
    const st = a.status === 'pendente' ? ['pen', 'clock', 'Aguardando o primeiro pagamento', 'Escolha o período e pague para ativar.']
      : venc ? ['ven', 'clock', 'Assinatura vencida', 'Venceu em ' + dataBR(a.valido_ate) + '. Renove para voltar a ter acesso.']
      : ['ok', 'check', 'Assinatura ativa', 'Vale até ' + dataBR(a.valido_ate) + '. Renovando agora, o tempo novo soma ao que falta.'];
    $('page').innerHTML = cabecalho(l, '') + `<div class="wrap" style="max-width:720px">
      <div class="sec card pad">
        <p class="small muted" style="margin:0 0 10px">Olá, <b>${esc(a.nome.split(' ')[0])}</b> · ${esc(a.email)}</p>
        <div class="stat ${st[0]}"><div class="ic">${ic(st[1])}</div><div><b>${st[2]}</b><span>${st[3]}</span></div></div>
        ${info.planos.length > 1 ? '<h3 style="font-size:1rem;margin:16px 0 8px">Plano</h3><div class="planos" id="pls"></div>' : `<h3 style="font-size:1rem;margin:16px 0 4px">${esc(plano.nome)}</h3>${plano.descricao ? `<p class="small muted" style="white-space:pre-line;margin:0">${esc(plano.descricao)}</p>` : ''}`}
        <h3 style="font-size:1rem;margin:16px 0 8px">Por quanto tempo?</h3>
        <div class="pers" id="pers"></div>
        <div class="res" id="res"></div>
        ${l.pode_pagar ? '<div id="pg"></div>' : '<div class="warnline" style="margin-top:12px">Esta loja ainda não ligou o pagamento online. Fale com ela pelo WhatsApp para renovar.</div>'}
        ${info.historico.length ? `<div class="hist"><b>Pagamentos</b>${info.historico.map(h => `<div><span>${dataBR(h.criado_em)} · ${nomePer(h.meses)} · ${brl(h.valor)}</span><span class="${GP.statusPag(h)[0]}">${GP.statusPag(h)[1]}</span></div>`).join('')}</div>` : ''}
      </div></div>`;
    fotos(l);
    const desenhar = () => {
      if ($('pls')) $('pls').innerHTML = info.planos.map(p => cardPlano(p, p.id === plano.id)).join('');
      $('pers').innerHTML = cardPeriodos(plano, meses);
      const v = Number(plano.precos[meses]);
      const base = a.status === 'ativo' && a.valido_ate && a.valido_ate >= hoje() ? a.valido_ate : hoje();
      const fim = new Date(base + 'T12:00:00Z'); fim.setUTCMonth(fim.getUTCMonth() + meses);
      $('res').innerHTML = `<span>${esc(plano.nome)} · ${nomePer(meses)} · vale até <b style="font-size:.95rem">${dataBR(fim.toISOString())}</b></span><b>${brl(v)}</b>`;
      if ($('pg')) areaPagamento($('pg'), { token: qs.get('t'), plano: plano.id, meses, valor: v, email: a.email, public_key: info.public_key, aoPagar: (r) => telaPago(r, plano.entrega_codigo ? 'Seu código chegou no e-mail. ' : '') });
    };
    if ($('pls')) $('pls').onclick = (e) => { const b = e.target.closest('[data-pl]'); if (!b) return; plano = info.planos.find(p => p.id === b.dataset.pl); meses = precosDe(plano)[0].m; desenhar(); };
    $('pers').onclick = (e) => { const b = e.target.closest('[data-m]'); if (!b) return; meses = +b.dataset.m; desenhar(); };
    desenhar();
    return;
  }

  // ===================== Assinar (?l=slug) =====================
  const slug = qs.get('l');
  if (!slug) return fail('Loja não informada', 'Abra pela página inicial.');
  const { data: loja, error } = await sb.from('ff_lojas').select('*').eq('slug', slug).eq('ativa', true).maybeSingle();
  if (error) return fail('Não foi possível abrir', esc(GP.err(error)));
  if (!loja) return fail('Loja não encontrada', 'O link pode estar errado ou saiu do ar.');
  if (loja.tipo !== 'assinatura') { location.replace('loja.html?l=' + encodeURIComponent(slug)); return; }
  GP.aplicarCor(loja.cor); document.title = `Assinar · ${loja.nome} · GoPedido`;
  const { data: planos } = await sb.from('ff_assin_planos').select('*').eq('loja_id', loja.id).eq('ativo', true).order('ordem').order('criado_em');
  let bloqueada = false; try { const { data: bq } = await sb.rpc('ff_loja_bloqueada', { p_loja: loja.id }); bloqueada = bq === true; } catch (_) {}
  const pode = loja.verificacao === 'verificada' && loja.mp_conectado && !bloqueada;
  const cli = GP.ls.get('gp_cliente', {}) || {};
  let plano = (planos || [])[0] || null, meses = plano ? precosDe(plano)[0].m : 1;
  $('page').innerHTML = cabecalho(loja, loja.descricao || 'Escolha um plano e assine pelo Pix ou cartão.') + `<div class="wrap" style="max-width:720px">
    ${!pode ? `<div class="alert off" style="margin-top:14px;background:var(--warn-soft);color:#7a4f0e">${ic('shield')}<span>${loja.verificacao !== 'verificada' ? 'Esta loja está em análise e ainda não recebe assinaturas.' : bloqueada ? 'Esta loja está temporariamente indisponível.' : 'Esta loja ainda não ligou o pagamento online. Fale com ela pelo WhatsApp.'}</span></div>` : ''}
    ${!(planos || []).length ? '<div class="empty" style="padding:40px 0"><div class="big">' + ic('star') + '</div><h4>Nenhum plano disponível</h4><p>Volte mais tarde ou fale com a loja.</p></div>' : `
    <div class="sec"><h2><span class="n">1</span>Escolha o plano</h2><div class="planos" id="pls"></div></div>
    <div class="sec"><h2><span class="n">2</span>Por quanto tempo?</h2><div class="pers" id="pers"></div><div class="res" id="res"></div></div>
    <div class="sec card pad"><h2 style="margin:0 0 10px;display:flex;gap:10px;align-items:center;font-size:1.05rem"><span class="n" style="width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.8rem">3</span>Seus dados</h2>
      <label class="field"><span>Nome</span><input class="input" id="a-nome" maxlength="80" autocomplete="name" value="${esc(cli.nome || '')}"></label>
      <label class="field"><span>E-mail</span><input class="input" id="a-email" type="email" maxlength="120" autocomplete="email" value="${esc(cli.email || '')}"><small>É por ele que chegam a confirmação${(planos || []).some(p => p.entrega_codigo) ? ', o código' : ''} e o aviso antes de vencer.</small></label>
      <label class="field"><span>WhatsApp <span class="muted">(opcional)</span></span><input class="input" id="a-tel" inputmode="tel" maxlength="16" autocomplete="tel" value="${esc(cli.telefone || '')}"></label>
      <button type="button" class="btn btn-primary btn-block" id="a-ir" ${pode ? '' : 'disabled'}>Continuar para o pagamento</button>
      <div id="pg" style="margin-top:6px"></div>
      <p class="small muted center" style="margin-top:12px">Sem cobrança automática: você renova quando quiser pelo link do e-mail. Ao assinar, você concorda com os <a href="termos.html" target="_blank" style="text-decoration:underline">Termos de Uso</a>.</p>
    </div>`}
  </div>`;
  fotos(loja);
  if (!plano) return;
  const desenhar = () => {
    $('pls').innerHTML = planos.map(p => cardPlano(p, p.id === plano.id)).join('');
    $('pers').innerHTML = cardPeriodos(plano, meses);
    const v = Number(plano.precos[meses]), fim = new Date(hoje() + 'T12:00:00Z'); fim.setUTCMonth(fim.getUTCMonth() + meses);
    $('res').innerHTML = `<span>${esc(plano.nome)} · ${nomePer(meses)} · vale até <b style="font-size:.95rem">${dataBR(fim.toISOString())}</b></span><b>${brl(v)}</b>`;
    $('pg').innerHTML = ''; clearInterval(poll); $('a-ir').classList.remove('hide');
  };
  $('pls').onclick = (e) => { const b = e.target.closest('[data-pl]'); if (!b) return; plano = planos.find(p => p.id === b.dataset.pl); meses = precosDe(plano)[0].m; desenhar(); };
  $('pers').onclick = (e) => { const b = e.target.closest('[data-m]'); if (!b) return; meses = +b.dataset.m; desenhar(); };
  desenhar();
  $('a-ir').onclick = async (e) => {
    const nome = $('a-nome').value.trim(), email = $('a-email').value.trim().toLowerCase(), tel = $('a-tel').value;
    if (nome.length < 2) return GP.toast('Digite seu nome.', 'err');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return GP.toast('Digite um e-mail válido.', 'err');
    const b = e.currentTarget; b.disabled = true; b.innerHTML = '<span class="spin"></span>Aguarde…';
    try {
      const r = await chamar({ acao: 'assin_novo', loja: loja.id, plano: plano.id, nome, email, telefone: tel });
      GP.ls.set('gp_cliente', { ...cli, nome, email, telefone: tel || cli.telefone || '' });
      if (r.ja_assinante) { b.disabled = false; b.textContent = 'Continuar para o pagamento'; $('pg').innerHTML = `<div class="alert" style="background:var(--brand-soft);margin-top:10px">${ic('mail')}<span>Você já é assinante deste plano. Mandamos para <b>${esc(email)}</b> o link para ver e renovar sua assinatura.</span></div>`; return; }
      b.classList.add('hide'); b.disabled = false; b.textContent = 'Continuar para o pagamento';
      let pk = '';
      try { const inf = await chamar({ acao: 'assin_info', token: r.token }); pk = inf.public_key; } catch (_) {}
      areaPagamento($('pg'), { token: r.token, plano: plano.id, meses, valor: Number(plano.precos[meses]), email, public_key: pk,
        aoPagar: (x) => { telaPago(x, plano.entrega_codigo ? 'Seu código chegou no e-mail. ' : ''); $('pg').insertAdjacentHTML('beforeend', `<a class="btn btn-ghost btn-block" href="assinatura.html?t=${encodeURIComponent(r.token)}">Ver minha assinatura</a>`); } });
    } catch (er) { b.disabled = false; b.textContent = 'Continuar para o pagamento'; GP.toast(er.message, 'err'); }
  };
})();
</script>
</body>
</html>
