<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Acompanhar pedido · GoPedido</title>
<meta name="theme-color" content="#F2451C">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=85548">
<style>
  .ok-hero{text-align:center;padding:34px 0 8px}
  .ok-hero .big{width:76px;height:76px;border-radius:24px;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 12px 30px rgba(20,148,90,.35);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .ok-hero .big .i{width:38px;height:38px;stroke-width:2.6}
  @keyframes pop{from{transform:scale(.4);opacity:0}}
  .ok-hero h1{font-size:1.6rem;letter-spacing:-.03em}
  .timeline{position:relative;padding-left:6px}
  .tl{display:flex;gap:14px;position:relative;padding-bottom:20px}
  .tl:last-child{padding-bottom:0}
  .tl::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
  .tl:last-child::before{display:none}
  .tl .b{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted);position:relative;z-index:1}
  .tl.done .b{background:var(--ok);border-color:var(--ok);color:#fff}
  .tl.done::before{background:var(--ok)}
  .tl.now .b{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 6px rgba(242,69,28,.15)}
  .tl h4{font-size:.96rem}
  .tl p{font-size:.84rem;color:var(--muted)}
  .item{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:.92rem}
  .store-mini{display:flex;gap:12px;align-items:center}
  .store-mini .lg{width:48px;height:48px;border-radius:14px;background:var(--brand-soft) center/cover;display:grid;place-items:center;color:var(--brand);font-weight:800}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pl 1.6s infinite}
  @keyframes pl{0%{box-shadow:0 0 0 0 rgba(20,148,90,.5)}100%{box-shadow:0 0 0 10px rgba(20,148,90,0)}}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap narrow">
    <a class="logo" href="./"><b id="lg"></b><span>Go<em>Pedido</em></span></a>
    <div class="grow"></div>
    <span class="live" id="live"><i></i>Atualizando ao vivo</span>
  </div>
</header>

<main class="wrap narrow" id="main" style="padding-bottom:40px">
  <div class="sk" style="height:120px;margin-top:30px"></div>
  <div class="sk" style="height:240px;margin-top:16px"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=85548"></script>
<script src="app.js?v=85548"></script>
<script>
(async () => {
  const { $, esc, brl, km, ic } = GP;
  $('lg').innerHTML = ic('bag');
  const sb = GP.client(false);
  const qs = new URLSearchParams(location.search);
  const token = qs.get('t');
  const novo = qs.get('novo') === '1';
  if (novo) history.replaceState(null, '', 'pedido.html?t=' + encodeURIComponent(token));

  const ORDEM = ['novo', 'preparando', 'saiu', 'entregue'];
  const ICS = { novo: 'receipt', preparando: 'bolt', saiu: 'bike', entregue: 'check' };
  let last = null;

  async function load() {
    ultLoad = Date.now();
    if (!token) return notFound();
    const { data, error } = await sb.rpc('ff_acompanhar', { p_token: token });
    if (error) { if (!last) $('main').innerHTML = `<div class="empty" style="padding-top:80px"><h4>Não foi possível carregar</h4><p>${esc(GP.err(error))}</p></div>`; return; }
    if (!data) return notFound();
    const sig = data.status + data.atualizado_em;
    if (sig === last) return;
    if (last && navigator.vibrate) navigator.vibrate(200);
    last = sig; render(data);
  }
  function notFound() {
    $('live').classList.add('hide');
    $('main').innerHTML = `<div class="empty" style="padding-top:80px"><div class="big">${ic('receipt')}</div><h4>Pedido não encontrado</h4><p>Confira o link que você recebeu.</p><a class="btn btn-primary" href="./" style="margin-top:16px">Voltar ao início</a></div>`;
  }

  // Envio sem código ainda: pergunta ao Melhor Envio (no máximo a cada 10 min por página)
  let ultRastreio = 0;
  function buscarRastreio(p) {
    if (p.tipo_entrega !== 'envio' || p.status === 'cancelado' || p.status === 'entregue' || Date.now() - ultRastreio < 600e3) return;
    ultRastreio = Date.now();
    sb.functions.invoke('ff-melhorenvio', { body: { acao: 'rastrear', token } }).then(({ data }) => {
      if (data && (data.rastreio && data.rastreio !== p.rastreio || data.status && data.status !== p.status)) { last = null; load(); }
    }).catch(() => {});
  }
  function render(p) {
    buscarRastreio(p);
    const st = GP.statusTxt(p);
    const ret = p.tipo_entrega === 'retirada', env = p.tipo_entrega === 'envio';
    const fim = p.status === 'entregue' || p.status === 'cancelado';
    $('live').classList.toggle('hide', fim);
    const idx = ORDEM.indexOf(p.status);
    const tl = p.status === 'cancelado'
      ? `<div class="tl now"><div class="b" style="background:var(--bad);border-color:var(--bad)">${ic('x')}</div><div><h4>Pedido cancelado</h4><p>Fale com a loja se tiver dúvidas.</p></div></div>`
      : ORDEM.map((s, i) => `<div class="tl ${i < idx || (i === idx && s === 'entregue') ? 'done' : i === idx ? 'now' : ''}">
          <div class="b">${ic(i < idx ? 'check' : ret && s === 'saiu' ? 'store' : env && s === 'saiu' ? 'box' : ICS[s])}</div>
          <div><h4>${GP.statusTxt(p, s).t}</h4><p>${i === idx ? GP.statusTxt(p, s).d + ' · ' + GP.hora(p.atualizado_em) : i === 0 ? GP.hora(p.criado_em) : ''}${s === 'saiu' && i <= idx && p.entregador_nome ? `<br>${ic('bike')} Entregador: <b>${esc(p.entregador_nome)}</b>` : ''}</p></div></div>`).join('');
    const l = p.loja;
    const msg = `Olá! Sou ${p.cliente_nome}, fiz o pedido #${p.numero} pelo GoPedido.`;
    $('main').innerHTML = `
      ${novo ? `<div class="ok-hero"><div class="big">${ic('check')}</div><h1>${env ? 'Pedido feito!' : 'Pedido enviado!'}</h1><p class="muted">${env ? 'A loja já recebeu e vai separar e postar seu pedido. Guarde este link: o código de rastreio aparece aqui.' : 'A loja já recebeu. Guarde este link para acompanhar.'}</p></div>` : '<div style="height:24px"></div>'}
      <div class="card pad" style="margin-top:14px">
        <div class="row between" style="margin-bottom:18px">
          <div><div class="small muted">Pedido</div><b style="font-size:1.3rem">#${p.numero}</b></div>
          <span class="badge ${st.c}"><i class="dot"></i>${st.t}</span>
        </div>
        <div class="timeline">${tl}</div>
        ${env && !p.rastreio && !fim && p.status !== 'novo' ? `<div class="fee" style="margin-top:18px;background:var(--bg);display:flex;gap:10px;padding:12px 14px;border-radius:12px;font-size:.9rem">${ic('box')}<span>O código de rastreio aparece aqui assim que a loja gerar a etiqueta.</span></div>` : ''}
        ${env && p.rastreio ? `<div class="fee" style="margin-top:18px;background:var(--bg);display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;font-size:.9rem">${ic('box')}<span class="grow">Código de rastreio: <b>${esc(p.rastreio)}</b></span><button type="button" class="btn btn-ghost btn-sm" id="b-rast-copy">${ic('copy')}Copiar</button><a class="btn btn-primary btn-sm" target="_blank" rel="noopener" href="https://www.melhorrastreio.com.br/rastreio/${encodeURIComponent(p.rastreio)}">Rastrear</a></div>` : ''}
        ${!fim && env && p.frete_prazo ? `<div class="fee" style="margin-top:12px;background:var(--bg);display:flex;gap:10px;padding:12px 14px;border-radius:12px;font-size:.9rem">${ic('clock')}<span>${esc(p.frete_nome || 'Transportadora')}: chega em até <b>${p.frete_prazo} dia${p.frete_prazo > 1 ? 's' : ''} útei${p.frete_prazo > 1 ? 's' : 'l'}</b> depois de postado</span></div>` : ''}
        ${!fim && !env && l.tempo_entrega ? `<div class="fee" style="margin-top:18px;background:var(--bg);display:flex;gap:10px;padding:12px 14px;border-radius:12px;font-size:.9rem">${ic('clock')}<span>Previsão da loja: <b>${esc(l.tempo_entrega)}</b></span></div>` : ''}
      </div>

      <div class="card pad" style="margin-top:14px">
        <div class="store-mini">
          <div class="lg" style="${l.imagem_url ? `background-image:url('${esc(l.imagem_url)}')` : ''}">${l.imagem_url ? '' : esc(l.nome.trim()[0])}</div>
          <div class="grow"><b>${esc(l.nome)}</b>${l.cnpj ? `<div class="small muted">CNPJ ${esc(GP.fmtCnpj(l.cnpj))}</div>` : ''}<div class="small muted">${esc(new Date(p.criado_em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }))}</div></div>
          ${l.telefone ? `<a class="btn btn-soft btn-sm" target="_blank" rel="noopener" href="${GP.wa(l.telefone, msg)}">${ic('chat')}WhatsApp</a>` : ''}
        </div>
        <div class="divider"></div>
        ${p.itens.map(i => `<div class="item"><span><b>${i.qtd}×</b> ${esc(i.nome)}${(i.opcoes || []).length ? `<div class="small muted">${esc(GP.txtOpcoes(i.opcoes))}</div>` : ''}${i.obs ? `<div class="small muted">Obs.: ${esc(i.obs)}</div>` : ''}</span><span>${brl(i.preco * i.qtd)}</span></div>`).join('')}
        <div class="divider"></div>
        <div class="sum-row"><span>Subtotal</span><span>${brl(p.subtotal)}</span></div>
        ${ret ? '<div class="sum-row"><span>Retirada no local</span><span>Grátis</span></div>' : env ? `<div class="sum-row"><span>Frete <span class="small muted">(${esc(p.frete_nome || 'envio')})</span></span><span>${brl(p.taxa_entrega)}</span></div>` : `<div class="sum-row"><span>Entrega <span class="small muted">(${km(p.distancia_km)})</span></span><span>${Number(p.taxa_entrega) ? brl(p.taxa_entrega) : 'Grátis'}</span></div>`}
        ${Number(p.desconto) ? `<div class="sum-row" style="color:var(--ok)"><span>Desconto${p.cupom ? ' (' + esc(p.cupom) + ')' : ''}</span><span>-${brl(p.desconto)}</span></div>` : ''}
        <div class="sum-row total"><span>Total</span><span>${brl(p.total)}</span></div>
      </div>

      <div class="card pad" style="margin-top:14px">
        ${ret ? `<div class="row" style="align-items:flex-start;margin-bottom:12px">${ic('store')}<div class="grow"><b class="small">Retirar na loja</b><div class="small muted">${esc(l.endereco || '')}</div></div>${l.lat != null ? `<a class="btn btn-soft btn-sm" target="_blank" rel="noopener" href="${GP.mapsLink(l.lat, l.lng)}">${ic('pin')}Ver no mapa</a>` : ''}</div>`
          : `<div class="row" style="align-items:flex-start;margin-bottom:12px">${ic(env ? 'box' : 'pin')}<div><b class="small">${env ? 'Enviar para' : 'Entregar em'}</b><div class="small muted">${esc(p.endereco)}${p.complemento ? ' · ' + esc(p.complemento) : ''}</div></div></div>`}
        <div class="row" style="align-items:flex-start">${ic(p.pagamento === 'pix' ? 'pix' : p.pagamento === 'dinheiro' ? 'cash' : 'card')}<div><b class="small">Pagamento</b><div class="small muted">${p.pagamento === 'dinheiro' ? GP.pagTexto(p) : GP.PAG[p.pagamento]}${p.pagamento === 'pix' ? ' · comprovante enviado' : ''}</div></div></div>
        ${p.observacao ? `<div class="row" style="align-items:flex-start;margin-top:12px">${ic('edit')}<div><b class="small">Observação</b><div class="small muted">${esc(p.observacao)}</div></div></div>` : ''}
      </div>

      ${p.status === 'entregue' ? `<div class="card pad" style="margin-top:14px;text-align:center" id="aval">
        ${p.avaliacao ? `<b>Sua avaliação</b><div style="font-size:1.6rem;margin:6px 0">${GP.estrelas(p.avaliacao.nota)}</div>${p.avaliacao.comentario ? `<p class="small muted">“${esc(p.avaliacao.comentario)}”</p>` : ''}${p.avaliacao.resposta ? `<div class="fee" style="margin-top:10px;text-align:left;background:var(--bg);display:block;padding:10px 12px;border-radius:12px;font-size:.88rem"><b>Resposta da loja:</b> ${esc(p.avaliacao.resposta)}</div>` : ''}<p class="small" style="margin-top:8px;color:var(--ok);font-weight:700">Obrigado por avaliar!</p>`
          : `<b style="font-size:1.05rem">Como foi seu pedido?</b><p class="small muted">Sua avaliação ajuda outros clientes e a loja.</p>
             <div class="starpick" id="sp">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" aria-label="${n} estrelas">★</button>`).join('')}</div>
             <div class="small muted" id="sp-txt" style="min-height:18px"></div>
             <textarea class="input" id="av-com" maxlength="500" placeholder="Conte como foi (opcional)" style="margin-top:10px;min-height:70px"></textarea>
             <button class="btn btn-primary btn-block" id="av-env" style="margin-top:10px" disabled>Enviar avaliação</button>`}
      </div>` : ''}

      <div class="row" style="margin-top:18px;gap:10px">
        <button class="btn btn-ghost grow" id="b-link">${ic('copy')}Copiar link</button>
        <a class="btn btn-dark grow" href="loja.html?l=${encodeURIComponent(l.slug)}">${ic('store')}Pedir de novo</a>
      </div>`;
    if ($('b-rast-copy')) $('b-rast-copy').onclick = () => GP.copy(p.rastreio, 'Código de rastreio copiado!');
    $('b-link').onclick = () => GP.copy(location.origin + location.pathname + '?t=' + encodeURIComponent(token), 'Link do pedido copiado!');
    if ($('sp')) {
      let nota = 0;
      const TXT = ['', 'Muito ruim', 'Ruim', 'Regular', 'Bom', 'Excelente!'];
      $('sp').onclick = (e) => {
        const b = e.target.closest('[data-n]'); if (!b) return;
        nota = +b.dataset.n;
        $('sp').querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.n <= nota));
        $('sp-txt').textContent = TXT[nota]; $('av-env').disabled = false;
      };
      $('av-env').onclick = async () => {
        const b = $('av-env'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
        const { error } = await sb.rpc('ff_avaliar', { p_token: token, p_nota: nota, p_comentario: $('av-com').value.trim() });
        if (error) { b.disabled = false; b.textContent = 'Enviar avaliação'; return GP.toast(GP.err(error), 'err'); }
        GP.toast('Avaliação enviada. Obrigado!', 'ok'); last = null; load();
      };
    }
  }

  let ultLoad = 0;
  await load();
  // Tempo real: o banco avisa este pedido na hora em que a loja ou o motoboy mudam a situação.
  const rt = token ? GP.ouvir(sb, 'pedido-' + token, () => load()) : null;
  // Reserva: com o tempo real ligado, confere a cada 1 min; sem ele, a cada 12 s.
  setInterval(() => { if (!document.hidden && (!(rt && rt.ativo()) || Date.now() - ultLoad > 60e3)) load(); }, 12000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
