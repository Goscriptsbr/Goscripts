<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Acompanhar pedido · GoPedido</title>
<meta name="theme-color" content="#F2451C">
<link rel="icon" href="img/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icone-180.png">
<link rel="manifest" href="manifest.json">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=46863">
<style>
  .ok-hero{text-align:center;padding:34px 0 8px}
  .ok-hero .big{width:76px;height:76px;border-radius:24px;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 12px 30px rgba(20,148,90,.35);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .ok-hero .big .i{width:38px;height:38px;stroke-width:2.6}
  @keyframes pop{from{transform:scale(.4);opacity:0}}
  .ok-hero h1{font-size:1.6rem;letter-spacing:-.03em}
  .timeline{position:relative;padding-left:6px}
  .tl{display:flex;gap:14px;position:relative;padding-bottom:20px}
  .tl:last-child{padding-bottom:0}
  .tl::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
  .tl:last-child::before{display:none}
  .tl .b{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted);position:relative;z-index:1}
  .tl.done .b{background:var(--ok);border-color:var(--ok);color:#fff}
  .tl.done::before{background:var(--ok)}
  .tl.now .b{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 6px rgba(242,69,28,.15)}
  .tl h4{font-size:.96rem}
  .tl p{font-size:.84rem;color:var(--muted)}
  .item{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:.92rem}
  .store-mini{display:flex;gap:12px;align-items:center}
  .store-mini .lg{width:48px;height:48px;border-radius:14px;background:var(--brand-soft) center/cover;display:grid;place-items:center;color:var(--brand);font-weight:800}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pl 1.6s infinite}
  @keyframes pl{0%{box-shadow:0 0 0 0 rgba(20,148,90,.5)}100%{box-shadow:0 0 0 10px rgba(20,148,90,0)}}
  .aviso-email{display:flex;gap:12px;align-items:flex-start;background:#FFF7E6;border:1px solid #F6D58E;border-radius:16px;padding:14px 16px;margin-top:14px;font-size:.88rem;line-height:1.5;color:#5c4210}
  .aviso-email .i{width:20px;height:20px;flex:none;margin-top:2px;color:#B7791F}
  .aviso-email > div > b{display:block;margin-bottom:2px;color:#3d2c07}
  .aviso-email span{display:block}
  .mpbox{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
  .mpbox.pend{border-color:#F1D9A8;background:#FFFBF2}
  .mpbox.ok{border-color:#BFE8D2;background:#F3FBF6}
  .mpbox .grow>b{display:block;font-size:1rem}
  .mpbox .grow>span{display:block;color:var(--ink-2);font-size:.88rem;line-height:1.5;margin-top:2px}
  .mpi{width:40px;height:40px;border-radius:12px;background:#E6F4FF;color:#0A6ED1;display:grid;place-items:center;flex:none}
  .mpi.ok{background:var(--ok-soft);color:var(--ok)}.mpi.bad{background:var(--bad-soft);color:var(--bad)}
  .mpcol{flex-direction:column;align-items:stretch;gap:12px}
  .mptabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px}
  .mptabs button{display:flex;align-items:center;justify-content:center;gap:7px;height:42px;border-radius:10px;font-weight:700;color:var(--ink-2)}
  .mptabs button.on{background:var(--ink);color:#fff}
  .pixqr{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
  .pixqr img{display:block;margin:0 auto 12px;border-radius:10px;width:200px;height:200px;image-rendering:pixelated}
  .pixqr ol{text-align:left;margin:0 0 12px;padding-left:20px;line-height:1.55}
  .pixcode{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:10px;max-height:64px;overflow:hidden;text-align:left}
  .pixcode code{font-size:.74rem;word-break:break-all;color:var(--ink-2)}
  .mpcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;min-height:120px}
  .linkbtn{background:none;border:0;color:var(--muted);font-size:.82rem;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:6px 0}
  .dot-live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulsa 1.4s infinite}
  @keyframes pulsa{50%{opacity:.3}}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap narrow">
    <a class="logo" href="./"><b id="lg"></b><span>Go<em>Pedido</em></span></a>
    <div class="grow"></div>
    <span class="live" id="live"><i></i>Atualizando ao vivo</span>
  </div>
</header>

<main class="wrap narrow" id="main" style="padding-bottom:40px">
  <div class="sk" style="height:120px;margin-top:30px"></div>
  <div class="sk" style="height:240px;margin-top:16px"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=32758"></script>
<script src="app.js?v=48530"></script>
<script>
(async () => {
  const { $, esc, brl, km, ic } = GP;
  $('lg').innerHTML = ic('bag');
  const sb = GP.client(false);
  const qs = new URLSearchParams(location.search);
  const token = qs.get('t');
  const novo = qs.get('novo') === '1';
  let emailPedido = '';
  try { if (novo) { emailPedido = sessionStorage.getItem('gp_email_pedido') || ''; sessionStorage.removeItem('gp_email_pedido'); } } catch (_) {}
  // Voltou do Mercado Pago: o endereço traz o número do pagamento para conferir na hora
  const voltouMP = qs.get('mp') === '1', pagMP = qs.get('payment_id') || qs.get('collection_id') || '';
  if (novo || voltouMP) history.replaceState(null, '', 'pedido.html?t=' + encodeURIComponent(token));
  let conferindo = voltouMP;

  const ORDEM = ['novo', 'preparando', 'saiu', 'entregue'];
  const ICS = { novo: 'receipt', preparando: 'bolt', saiu: 'bike', entregue: 'check' };
  let last = null;

  async function load() {
    ultLoad = Date.now();
    if (!token) return notFound();
    const { data, error } = await sb.rpc('ff_acompanhar', { p_token: token });
    if (error) { if (!last) $('main').innerHTML = `<div class="empty" style="padding-top:80px"><h4>Não foi possível carregar</h4><p>${esc(GP.err(error))}</p></div>`; return; }
    if (!data) return notFound();
    const sig = data.status + data.atualizado_em + (data.mp_status || '') + (conferindo ? '1' : '');
    if (sig === last) return;
    if (last && navigator.vibrate) navigator.vibrate(200);
    last = sig; render(data);
  }
  function notFound() {
    $('live').classList.add('hide');
    $('main').innerHTML = `<div class="empty" style="padding-top:80px"><div class="big">${ic('receipt')}</div><h4>Pedido não encontrado</h4><p>Confira o link que você recebeu.</p><a class="btn btn-primary" href="./" style="margin-top:16px">Voltar ao início</a></div>`;
  }

  // Envio sem código ainda: pergunta ao Melhor Envio (no máximo a cada 10 min por página)
  let ultRastreio = 0;
  function buscarRastreio(p) {
    if (p.tipo_entrega !== 'envio' || p.status === 'cancelado' || p.status === 'entregue' || Date.now() - ultRastreio < 600e3) return;
    ultRastreio = Date.now();
    sb.functions.invoke('ff-melhorenvio', { body: { acao: 'rastrear', token } }).then(({ data }) => {
      if (data && (data.rastreio && data.rastreio !== p.rastreio || data.status && data.status !== p.status)) { last = null; load(); }
    }).catch(() => {});
  }
  // Bloco do pagamento online: falta pagar, recusado ou aprovado
  function blocoMP(p) {
    if (p.pagamento !== 'mp') return '';
    if (p.status === 'cancelado') return p.mp_status === 'estornado'
      ? `<div class="mpbox"><div class="mpi ok">${ic('refresh')}</div><div class="grow"><b>Valor devolvido</b><span>O Mercado Pago devolveu ${brl(p.total)} no mesmo meio de pagamento. No cartão, pode aparecer só na próxima fatura.</span></div></div>` : '';
    if (p.mp_status === 'aprovado') return `<div class="mpbox ok"><div class="mpi ok">${ic('check')}</div><div class="grow"><b>Pagamento aprovado</b><span>${brl(p.total)} pagos online pelo Mercado Pago${p.pago_em ? ' às ' + GP.hora(p.pago_em) : ''}.</span></div></div>`;
    if (conferindo) return `<div class="mpbox"><div class="mpi"><span class="spin"></span></div><div class="grow"><b>Conferindo o pagamento…</b><span>Só um instante.</span></div></div>`;
    const rec = p.mp_status === 'recusado';
    return `<div class="mpbox pend mpcol">
      <div class="row" style="gap:12px;align-items:flex-start">
        <div class="mpi ${rec ? 'bad' : ''}">${ic(rec ? 'x' : 'card')}</div>
        <div class="grow"><b>${rec ? 'O pagamento não foi aprovado' : `Falta pagar ${brl(p.total)}`}</b><span>${rec ? 'Tente de novo com outro cartão ou pague com Pix.' : 'A loja começa a preparar assim que o pagamento for aprovado. Se não for pago em 2 horas, o pedido é cancelado.'}</span></div>
      </div>
      <div class="mptabs" role="tablist">
        <button type="button" role="tab" data-mpt="pix" class="${mpAba === 'pix' ? 'on' : ''}">${ic('pix')}Pix</button>
        <button type="button" role="tab" data-mpt="cartao" class="${mpAba === 'cartao' ? 'on' : ''}">${ic('card')}Cartão de crédito</button>
      </div>
      <div id="mp-area"></div>
      <div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px">
        <button type="button" class="btn btn-ghost btn-sm" id="b-conferir">${ic('refresh')}Já paguei</button>
        <button type="button" class="linkbtn" id="b-pagar">Prefere pagar no site do Mercado Pago?</button>
      </div></div>`;
  }
  // ---------- pagamento dentro da página ----------
  let mpAba = 'pix', mpPix = null, mpIni = null, mpBrick = null, mpPoll = 0;
  const erroMP = async (error) => { let j = null; try { j = error && error.context && await error.context.json(); } catch (_) {} return j || {}; };
  async function mpIniciar() {
    if (mpIni) return mpIni;
    const { data, error } = await sb.functions.invoke('ff-mercadopago', { body: { acao: 'iniciar', token } });
    if (error) { const j = await erroMP(error); throw new Error(j.error === 'mp_desconectado' ? 'A loja desligou o pagamento online. Fale com ela pelo WhatsApp.' : 'Não foi possível abrir o pagamento agora. Tente de novo em instantes.'); }
    mpIni = data; return data;
  }
  function areaMP(p) {
    const el = $('mp-area'); if (!el) return;
    if (mpAba === 'pix') return areaPix(p, el);
    return areaCartao(p, el);
  }
  async function areaPix(p, el) {
    if (mpPix && mpPix.qr) {
      el.innerHTML = `<div class="pixqr">
        ${mpPix.qr_img ? `<img src="data:image/png;base64,${mpPix.qr_img}" width="200" height="200" alt="QR Code do Pix">` : ''}
        <ol class="small muted"><li>Abra o app do seu banco e escolha <b>Pix → Ler QR Code</b> ou <b>Pix Copia e Cola</b>.</li><li>Confira o valor de <b>${brl(mpPix.valor || p.total)}</b> e pague.</li><li>Esta página confirma sozinha em alguns segundos.</li></ol>
        <div class="pixcode"><code>${esc(mpPix.qr)}</code></div>
        <button type="button" class="btn btn-primary btn-block" id="b-pixcopy">${ic('copy')}Copiar código Pix</button>
        <p class="small muted" style="text-align:center;margin-top:8px"><span class="dot-live"></span>Aguardando o pagamento…</p></div>`;
      $('b-pixcopy').onclick = () => GP.copy(mpPix.qr, 'Código Pix copiado! Cole no app do seu banco.');
      clearInterval(mpPoll); mpPoll = setInterval(() => { if (!document.hidden) { last = null; load(); } }, 5000);
      return;
    }
    const precisaEmail = !p.cliente_email;
    el.innerHTML = `<div class="pixqr">${precisaEmail ? `<label class="field" style="text-align:left"><span>Seu e-mail <span class="muted">(o Mercado Pago pede para o Pix)</span></span><input class="input" id="mp-email" type="email" autocomplete="email" placeholder="voce@email.com"></label>` : ''}
      <button type="button" class="btn btn-primary btn-block" id="b-gerapix">${ic('pix')}Gerar Pix de ${brl(p.total)}</button></div>`;
    $('b-gerapix').onclick = async () => {
      const b = $('b-gerapix'), email = precisaEmail ? $('mp-email').value.trim() : '';
      if (precisaEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { GP.toast('Digite um e-mail válido.', 'err'); $('mp-email').focus(); return; }
      b.disabled = true; b.innerHTML = '<span class="spin"></span>Gerando o Pix…';
      const { data, error } = await sb.functions.invoke('ff-mercadopago', { body: { acao: 'pix', token, email } });
      if (data && data.pago) { last = null; return load(); }
      if (data && data.qr) { mpPix = data; return areaPix(p, el); }
      const j = await erroMP(error);
      b.disabled = false; b.innerHTML = ic('pix') + 'Gerar Pix de ' + brl(p.total);
      GP.toast(j.error === 'email_obrigatorio' ? 'Digite um e-mail válido.' : j.error === 'mp_desconectado' ? 'A loja desligou o pagamento online. Fale com ela pelo WhatsApp.' : 'Não foi possível gerar o Pix. Tente de novo.', 'err');
    };
  }
  function carregarSDK() {
    if (window.MercadoPago) return Promise.resolve();
    return new Promise((ok, falha) => { const s = document.createElement('script'); s.src = 'https://sdk.mercadopago.com/js/v2'; s.onload = ok; s.onerror = () => falha(new Error('sdk')); document.head.appendChild(s); });
  }
  async function areaCartao(p, el) {
    clearInterval(mpPoll);
    el.innerHTML = `<div id="mp-card" class="mpcard"><p class="small muted" style="text-align:center;padding:24px 0"><span class="spin"></span> Carregando o formulário seguro do Mercado Pago…</p></div>
      <p class="small muted" style="display:flex;gap:6px;align-items:center;justify-content:center;margin-top:8px">${ic('lock')}Pagamento direto no Mercado Pago da loja. Nem a loja nem o GoPedido veem os dados do seu cartão.</p>`;
    try {
      const ini = await mpIniciar();
      if (ini.pago) { last = null; return load(); }
      if (!ini.public_key) throw new Error('A loja precisa reconectar o Mercado Pago para aceitar cartão. Use o Pix por enquanto.');
      await carregarSDK();
      if (typeof window.MercadoPago !== 'function') throw new Error('sdk');
      if (mpBrick) { try { await mpBrick.unmount(); } catch (_) {} mpBrick = null; }
      if (!$('mp-card')) return;
      $('mp-card').innerHTML = '';
      const mpx = new window.MercadoPago(ini.public_key, { locale: 'pt-BR' });
      mpBrick = await mpx.bricks().create('cardPayment', 'mp-card', {
        initialization: { amount: Number(p.total), payer: { email: p.cliente_email || ini.email || '' } },
        customization: { paymentMethods: { maxInstallments: 12, types: { excluded: ['debit_card', 'prepaid_card'] } }, visual: { style: { theme: 'default', customVariables: { baseColor: '#F2451C' } } } },
        callbacks: {
          onReady: () => {},
          onError: () => {},
          onSubmit: async (dados) => {
            const { data, error } = await sb.functions.invoke('ff-mercadopago', { body: { acao: 'cartao', token, dados } });
            if (data && (data.mp_status === 'aprovado' || data.pago)) { GP.toast('Pagamento aprovado!', 'ok'); last = null; await load(); return; }
            if (data && data.mp_status === 'pendente') { GP.toast('Pagamento em análise pelo Mercado Pago. Esta página atualiza sozinha.'); last = null; await load(); return; }
            const j = data || await erroMP(error);
            const MSG = { cc_rejected_insufficient_amount: 'Saldo ou limite insuficiente.', cc_rejected_bad_filled_security_code: 'Código de segurança (CVV) incorreto.', cc_rejected_bad_filled_date: 'Data de validade incorreta.', cc_rejected_bad_filled_other: 'Confira os dados do cartão.', cc_rejected_call_for_authorize: 'O banco pediu para autorizar a compra. Ligue para o seu banco ou use outro cartão.', cc_rejected_high_risk: 'O pagamento foi recusado por segurança. Tente o Pix.' };
            const cod = [j.error, j.detalhe].filter(Boolean).join(' · ').slice(0, 160);
            GP.toast((MSG[j.detalhe] || 'O cartão não foi aprovado.') + ' Tente outro cartão ou o Pix.' + (!MSG[j.detalhe] && cod ? ' (' + cod + ')' : ''), 'err');
            if (cod) console.warn('[mp]', cod);
            last = null; await load();
            throw new Error('recusado');   // avisa o formulário para liberar o botão de novo
          }
        }
      });
    } catch (er) {
      if ($('mp-card')) $('mp-card').innerHTML = `<p class="small" style="color:var(--bad);text-align:center;padding:16px 0">${esc(er.message === 'sdk' ? 'Não foi possível carregar o formulário do cartão. Confira a internet ou use o Pix.' : er.message)}</p>`;
    }
  }
  async function conferirMP(pagamento) {
    try { await sb.functions.invoke('ff-mercadopago', { body: { acao: 'conferir', token, pagamento } }); } catch (_) {}
    conferindo = false; last = null; await load();
  }
  // Nota fiscal anexada pela loja
  function blocoNota(p) {
    if (!p.nf && !p.nf_chave) return '';
    const ch = String(p.nf_chave || '').replace(/(\d{4})(?=\d)/g, '$1 ');
    return `<div class="card pad" style="margin-top:14px"><div class="row" style="align-items:flex-start;gap:12px">${ic('receipt')}
      <div class="grow" style="min-width:0"><b class="small">Nota fiscal</b>${ch ? `<div class="small muted" style="overflow-wrap:anywhere">Chave de acesso: ${esc(ch)}</div>` : '<div class="small muted">A loja anexou a nota fiscal do seu pedido.</div>'}
        <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:10px">
          ${p.nf ? `<button class="btn btn-soft btn-sm" id="b-nf">${ic('ext')}Baixar PDF</button>` : ''}
          ${ch ? `<button class="btn btn-ghost btn-sm" id="b-nf-copy">${ic('copy')}Copiar chave</button>` : ''}</div></div></div></div>`;
  }

  function render(p) {
    buscarRastreio(p);
    if (window.__emailPedido) {
      if (p.pagamento === 'mp' && p.mp_status === 'aprovado') window.__emailPedido('novo');
      if (p.tipo_entrega === 'envio' && p.rastreio && p.status !== 'cancelado') window.__emailPedido('postado');
      if (p.status === 'cancelado') window.__emailPedido('cancelado');
    }
    const st = GP.statusTxt(p);
    const ret = p.tipo_entrega === 'retirada', env = p.tipo_entrega === 'envio';
    const fim = p.status === 'entregue' || p.status === 'cancelado';
    $('live').classList.toggle('hide', fim);
    const idx = ORDEM.indexOf(p.status);
    const tl = p.status === 'cancelado'
      ? `<div class="tl now"><div class="b" style="background:var(--bad);border-color:var(--bad)">${ic('x')}</div><div><h4>Pedido cancelado</h4><p>Fale com a loja se tiver dúvidas.</p></div></div>`
      : ORDEM.map((s, i) => `<div class="tl ${i < idx || (i === idx && s === 'entregue') ? 'done' : i === idx ? 'now' : ''}">
          <div class="b">${ic(i < idx ? 'check' : ret && s === 'saiu' ? 'store' : env && s === 'saiu' ? 'box' : ICS[s])}</div>
          <div><h4>${GP.statusTxt(p, s).t}</h4><p>${i === idx ? GP.statusTxt(p, s).d + ' · ' + GP.hora(p.atualizado_em) : i === 0 ? GP.hora(p.criado_em) : ''}${s === 'saiu' && i <= idx && p.entregador_nome ? `<br>${ic('bike')} Entregador: <b>${esc(p.entregador_nome)}</b>` : ''}</p></div></div>`).join('');
    const l = p.loja;
    const msg = `Olá! Sou ${p.cliente_nome}, fiz o pedido #${p.numero} pelo GoPedido.`;
    $('main').innerHTML = `
      ${blocoMP(p)}
      ${novo && !(p.pagamento === 'mp' && p.mp_status !== 'aprovado') ? `<div class="ok-hero"><div class="big">${ic('check')}</div><h1>${env ? 'Pedido feito!' : 'Pedido enviado!'}</h1><p class="muted">${env ? 'A loja já recebeu e vai separar e postar seu pedido. Guarde este link: o código de rastreio aparece aqui.' : 'A loja já recebeu. Guarde este link para acompanhar.'}</p></div>` : '<div style="height:24px"></div>'}
      ${novo && emailPedido ? `<div class="aviso-email">${ic('bell')}<div><b>Enviamos um e-mail para ${esc(emailPedido)}</b><span>Com o resumo e o link do pedido${env ? ' (e, quando a loja postar, o código de rastreio)' : ''}. <b>Não chegou em alguns minutos?</b> Olhe a pasta <b>Spam</b> ou <b>Promoções</b> e marque como "Não é spam" para receber os próximos.</span></div></div>` : ''}
      <div class="card pad" style="margin-top:14px">
        <div class="row between" style="margin-bottom:18px">
          <div><div class="small muted">Pedido</div><b style="font-size:1.3rem">#${p.numero}</b></div>
          <span class="badge ${st.c}"><i class="dot"></i>${st.t}</span>
        </div>
        <div class="timeline">${tl}</div>
        ${env && !p.rastreio && !fim && p.status !== 'novo' ? `<div class="fee" style="margin-top:18px;background:var(--bg);display:flex;gap:10px;padding:12px 14px;border-radius:12px;font-size:.9rem">${ic('box')}<span>O código de rastreio aparece aqui assim que a loja gerar a etiqueta.</span></div>` : ''}
        ${env && p.rastreio ? `<div class="fee" style="margin-top:18px;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;font-size:.9rem">${ic('box')}<span class="grow" style="min-width:190px">Código de rastreio: <b>${esc(p.rastreio)}</b></span><button type="button" class="btn btn-ghost btn-sm" id="b-rast-copy">${ic('copy')}Copiar</button><a class="btn btn-primary btn-sm" target="_blank" rel="noopener" href="https://www.melhorrastreio.com.br/rastreio/${encodeURIComponent(p.rastreio)}">Rastrear</a></div>` : ''}
        ${!fim && env && p.frete_prazo ? `<div class="fee" style="margin-top:12px;background:var(--bg);display:flex;gap:10px;padding:12px 14px;border-radius:12px;font-size:.9rem">${ic('clock')}<span>${esc(p.frete_nome || 'Transportadora')}: chega em até <b>${p.frete_prazo} dia${p.frete_prazo > 1 ? 's' : ''} útei${p.frete_prazo > 1 ? 's' : 'l'}</b> depois de postado</span></div>` : ''}
        ${!fim && !env && l.tempo_entrega ? `<div class="fee" style="margin-top:18px;background:var(--bg);display:flex;gap:10px;padding:12px 14px;border-radius:12px;font-size:.9rem">${ic('clock')}<span>Previsão da loja: <b>${esc(l.tempo_entrega)}</b></span></div>` : ''}
      </div>

      ${blocoNota(p)}
      <div class="card pad" style="margin-top:14px">
        <div class="store-mini">
          <div class="lg" style="${l.imagem_url ? `background-image:url('${esc(l.imagem_url)}')` : ''}">${l.imagem_url ? '' : esc(l.nome.trim()[0])}</div>
          <div class="grow"><b>${esc(l.nome)}</b>${l.cnpj ? `<div class="small muted">CNPJ ${esc(GP.fmtCnpj(l.cnpj))}</div>` : ''}<div class="small muted">${esc(new Date(p.criado_em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }))}</div></div>
          ${l.telefone ? `<a class="btn btn-soft btn-sm" target="_blank" rel="noopener" href="${GP.wa(l.telefone, msg)}">${ic('chat')}WhatsApp</a>` : ''}
        </div>
        <p class="small muted vendido" style="margin-top:12px">${ic('store')}<span>Pedido vendido e entregue por <b>${esc(l.nome)}</b>. Dúvidas, trocas e reembolsos: fale com a loja${l.telefone ? ' pelo WhatsApp' : ''}. <a href="entregas.html" target="_blank" rel="noopener">Como funcionam entregas e reembolsos</a></span></p>
        <div class="divider"></div>
        ${p.itens.map(i => `<div class="item"><span><b>${i.qtd}×</b> ${esc(i.nome)}${(i.opcoes || []).length ? `<div class="small muted">${esc(GP.txtOpcoes(i.opcoes))}</div>` : ''}${i.obs ? `<div class="small muted">Obs.: ${esc(i.obs)}</div>` : ''}</span><span>${brl(i.preco * i.qtd)}</span></div>`).join('')}
        <div class="divider"></div>
        <div class="sum-row"><span>Subtotal</span><span>${brl(p.subtotal)}</span></div>
        ${ret ? '<div class="sum-row"><span>Retirada no local</span><span>Grátis</span></div>' : env ? `<div class="sum-row"><span>Frete <span class="small muted">(${esc(p.frete_nome || 'envio')})</span></span><span>${brl(p.taxa_entrega)}</span></div>` : `<div class="sum-row"><span>Entrega <span class="small muted">(${km(p.distancia_km)})</span></span><span>${Number(p.taxa_entrega) ? brl(p.taxa_entrega) : 'Grátis'}</span></div>`}
        ${Number(p.desconto) ? `<div class="sum-row" style="color:var(--ok)"><span>Desconto${p.cupom ? ' (' + esc(p.cupom) + ')' : ''}</span><span>-${brl(p.desconto)}</span></div>` : ''}
        <div class="sum-row total"><span>Total</span><span>${brl(p.total)}</span></div>
      </div>

      <div class="card pad" style="margin-top:14px">
        ${ret ? `<div class="row" style="align-items:flex-start;margin-bottom:12px">${ic('store')}<div class="grow"><b class="small">Retirar na loja</b><div class="small muted">${esc(l.endereco || '')}</div></div>${l.lat != null ? `<a class="btn btn-soft btn-sm" target="_blank" rel="noopener" href="${GP.mapsLink(l.lat, l.lng)}">${ic('pin')}Ver no mapa</a>` : ''}</div>`
          : `<div class="row" style="align-items:flex-start;margin-bottom:12px">${ic(env ? 'box' : 'pin')}<div><b class="small">${env ? 'Enviar para' : 'Entregar em'}</b><div class="small muted">${esc(p.endereco)}${p.complemento ? ' · ' + esc(p.complemento) : ''}</div></div></div>`}
        <div class="row" style="align-items:flex-start">${ic(p.pagamento === 'pix' ? 'pix' : p.pagamento === 'dinheiro' ? 'cash' : 'card')}<div><b class="small">Pagamento</b><div class="small muted">${p.pagamento === 'dinheiro' || p.pagamento === 'mp' ? GP.pagTexto(p) : GP.PAG[p.pagamento]}${p.pagamento === 'pix' ? ' · comprovante enviado' : ''}</div></div></div>
        ${p.observacao ? `<div class="row" style="align-items:flex-start;margin-top:12px">${ic('edit')}<div><b class="small">Observação</b><div class="small muted">${esc(p.observacao)}</div></div></div>` : ''}
      </div>

      ${p.status === 'entregue' ? `<div class="card pad" style="margin-top:14px;text-align:center" id="aval">
        ${p.avaliacao ? `<b>Sua avaliação</b><div style="font-size:1.6rem;margin:6px 0">${GP.estrelas(p.avaliacao.nota)}</div>${p.avaliacao.comentario ? `<p class="small muted">“${esc(p.avaliacao.comentario)}”</p>` : ''}${p.avaliacao.resposta ? `<div class="fee" style="margin-top:10px;text-align:left;background:var(--bg);display:block;padding:10px 12px;border-radius:12px;font-size:.88rem"><b>Resposta da loja:</b> ${esc(p.avaliacao.resposta)}</div>` : ''}<p class="small" style="margin-top:8px;color:var(--ok);font-weight:700">Obrigado por avaliar!</p>`
          : `<b style="font-size:1.05rem">Como foi seu pedido?</b><p class="small muted">Sua avaliação ajuda outros clientes e a loja.</p>
             <div class="starpick" id="sp">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" aria-label="${n} estrelas">★</button>`).join('')}</div>
             <div class="small muted" id="sp-txt" style="min-height:18px"></div>
             <textarea class="input" id="av-com" maxlength="500" placeholder="Conte como foi (opcional)" style="margin-top:10px;min-height:70px"></textarea>
             <button class="btn btn-primary btn-block" id="av-env" style="margin-top:10px" disabled>Enviar avaliação</button>`}
      </div>` : ''}

      <div class="row" style="margin-top:18px;gap:10px">
        <button class="btn btn-ghost grow" id="b-link">${ic('copy')}Copiar link</button>
        <a class="btn btn-dark grow" href="loja.html?l=${encodeURIComponent(l.slug)}">${ic('store')}Pedir de novo</a>
      </div>`;
    if ($('b-rast-copy')) $('b-rast-copy').onclick = () => GP.copy(p.rastreio, 'Código de rastreio copiado!');
    if ($('mp-area')) {
      document.querySelectorAll('[data-mpt]').forEach(t => t.onclick = () => { mpAba = t.dataset.mpt; document.querySelectorAll('[data-mpt]').forEach(x => x.classList.toggle('on', x === t)); areaMP(p); });
      areaMP(p);
    } else { clearInterval(mpPoll); if (mpBrick) { try { mpBrick.unmount(); } catch (_) {} mpBrick = null; } }
    if ($('b-pagar')) $('b-pagar').onclick = async () => {
      const b = $('b-pagar'); b.disabled = true; b.textContent = 'Abrindo o Mercado Pago…';
      const { data, error } = await sb.functions.invoke('ff-mercadopago', { body: { acao: 'pagar', token } });
      if (data && data.url) { location.href = data.url; return; }
      if (data && data.pago) { last = null; return load(); }
      b.disabled = false; b.textContent = 'Prefere pagar no site do Mercado Pago?';
      let j = null; try { j = error && error.context && await error.context.json(); } catch (_) {}
      GP.toast(j && j.error === 'mp_desconectado' ? 'A loja desligou o pagamento online. Fale com ela pelo WhatsApp.' : 'Não foi possível abrir o pagamento. Tente de novo em instantes.', 'err');
    };
    if ($('b-conferir')) $('b-conferir').onclick = () => { conferindo = true; last = null; render(p); conferirMP(''); };
    if ($('b-nf')) $('b-nf').onclick = async () => {
      const janela = window.open('', '_blank');
      const { data } = await sb.functions.invoke('ff-email', { body: { acao: 'nf_link', token } });
      if (data && data.url) { if (janela) janela.location = data.url; else location.href = data.url; }
      else { if (janela) janela.close(); GP.toast('Não foi possível abrir a nota. Tente de novo.', 'err'); }
    };
    if ($('b-nf-copy')) $('b-nf-copy').onclick = () => GP.copy(p.nf_chave, 'Chave de acesso copiada!');
    $('b-link').onclick = () => GP.copy(location.origin + location.pathname + '?t=' + encodeURIComponent(token), 'Link do pedido copiado!');
    if ($('sp')) {
      let nota = 0;
      const TXT = ['', 'Muito ruim', 'Ruim', 'Regular', 'Bom', 'Excelente!'];
      $('sp').onclick = (e) => {
        const b = e.target.closest('[data-n]'); if (!b) return;
        nota = +b.dataset.n;
        $('sp').querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.n <= nota));
        $('sp-txt').textContent = TXT[nota]; $('av-env').disabled = false;
      };
      $('av-env').onclick = async () => {
        const b = $('av-env'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
        const { error } = await sb.rpc('ff_avaliar', { p_token: token, p_nota: nota, p_comentario: $('av-com').value.trim() });
        if (error) { b.disabled = false; b.textContent = 'Enviar avaliação'; return GP.toast(GP.err(error), 'err'); }
        GP.toast('Avaliação enviada. Obrigado!', 'ok'); last = null; load();
      };
      // Veio do e-mail "Como foi seu pedido?": já marca a estrela tocada e leva até a avaliação
      if (!veioAval) {
        veioAval = true;
        const qs = new URLSearchParams(location.search), n = parseInt(qs.get('nota') || '', 10);
        if (n >= 1 && n <= 5) { const bt = $('sp').querySelector(`[data-n="${n}"]`); if (bt) bt.click(); }
        if ((n >= 1 && n <= 5) || qs.get('avaliar') === '1' || location.hash === '#aval') {
          setTimeout(() => { $('aval').scrollIntoView({ behavior: 'smooth', block: 'center' }); if (n >= 1) $('av-com').focus({ preventScroll: true }); }, 350);
        }
      }
    }
  }

  let ultLoad = 0;
  let veioAval = false;
  await load();
  if (voltouMP) conferirMP(/^\d{1,20}$/.test(pagMP) ? pagMP : '');
  // E-mail para o cliente: o servidor confere a situação do pedido e manda cada e-mail uma vez só
  const avisados = new Set();
  window.__emailPedido = (tipo) => { if (avisados.has(tipo)) return; avisados.add(tipo); sb.functions.invoke('ff-email', { body: { token, tipo } }).catch(() => {}); };
  if (novo && last && !(last && /pendente|recusado/.test(last))) window.__emailPedido('novo');
  // Tempo real: o banco avisa este pedido na hora em que a loja ou o motoboy mudam a situação.
  const rt = token ? GP.ouvir(sb, 'pedido-' + token, () => load()) : null;
  // Reserva: com o tempo real ligado, confere a cada 1 min; sem ele, a cada 12 s.
  setInterval(() => { if (!document.hidden && (!(rt && rt.ativo()) || Date.now() - ultLoad > 60e3)) load(); }, 12000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
