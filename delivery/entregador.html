<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Entregas · GoPedido</title>
<meta name="theme-color" content="#16161B">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=43432">
<style>
  body{background:#F2F1EE}
  .entry{min-height:100vh;display:grid;place-items:center;padding:24px 18px;background:radial-gradient(800px 400px at 50% -10%,rgba(242,69,28,.25),transparent 60%),var(--ink);color:#fff}
  .entry .box{width:min(400px,100%)}
  .entry .big{width:72px;height:72px;border-radius:22px;background:var(--brand);display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 14px 30px rgba(242,69,28,.4)}
  .entry .big .i{width:36px;height:36px}
  .entry h1{text-align:center;font-size:1.6rem;letter-spacing:-.03em}
  .entry p{text-align:center;color:#b9b9c4;margin:6px 0 24px}
  .entry .field>span{color:#d6d6dd}
  .entry .input{background:#24242c;border-color:#34343e;color:#fff;height:52px}
  .entry .input:focus{border-color:var(--brand)}
  #e-cod{font-family:ui-monospace,Menlo,monospace;font-size:1.4rem;letter-spacing:.2em;text-align:center;text-transform:uppercase;font-weight:800}
  .hdr{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
  .hdr .wrap{display:flex;align-items:center;gap:12px;height:64px}
  .hdr .lg{width:40px;height:40px;border-radius:12px;background:#333 center/cover;display:grid;place-items:center;font-weight:800;flex:none}
  .hdr .sub{color:#b9b9c4;font-size:.76rem}
  .hdr .icon-btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff}
  .seg2{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;margin:16px 0}
  .seg2 button{flex:1;height:42px;border-radius:10px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
  .seg2 button.on{background:var(--ink);color:#fff}
  .seg2 .n{background:var(--brand);color:#fff;border-radius:999px;min-width:20px;height:20px;font-size:.72rem;display:grid;place-items:center;padding:0 6px}
  .del{margin-bottom:14px;overflow:hidden}
  .del .top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .del .body{padding:14px 16px}
  .del .addr{font-size:1.02rem;font-weight:700;line-height:1.35}
  .del .money{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;margin:12px 0;font-weight:700}
  .del .money.card{background:var(--warn-soft);color:#7a4f0e}
  .del .money.paid{background:var(--ok-soft);color:#0d6b41}
  .del .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .del .main{padding:0 16px 16px}
  .del .main .btn{height:54px;font-size:1.02rem;width:100%}
  .its{font-size:.86rem;color:var(--ink-2);background:var(--bg);border-radius:10px;padding:8px 12px}
</style>
</head>
<body>

<!-- Entrada com código -->
<div class="entry hide" id="v-entry">
  <div class="box">
    <div class="big" id="e-ic"></div>
    <h1>Área do entregador</h1>
    <p>Digite o código que a loja te enviou.</p>
    <form id="f-entry">
      <label class="field"><span>Código da loja</span><input class="input" id="e-cod" maxlength="9" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX" required></label>
      <label class="field"><span>Seu nome</span><input class="input" id="e-nome" maxlength="60" autocomplete="name" placeholder="Aparece para a loja e para o cliente" required></label>
      <button class="btn btn-primary btn-block" id="e-btn" style="height:52px">Entrar</button>
    </form>
    <p class="small" style="margin-top:18px">O código vale por 8 horas. Depois disso, peça o novo para a loja.</p>
  </div>
</div>

<!-- Entregas -->
<div class="hide" id="v-app">
  <header class="hdr">
    <div class="wrap narrow">
      <div class="lg" id="h-lg"></div>
      <div class="grow" style="min-width:0"><b class="ellipsis" style="display:block" id="h-loja"></b><div class="sub" id="h-sub"></div></div>
      <button class="icon-btn" id="b-sair" title="Sair"></button>
    </div>
  </header>
  <main class="wrap narrow" style="padding-bottom:40px">
    <div class="seg2" id="seg">
      <button data-t="retirar" class="on">Retirar <span class="n hide" id="n-retirar"></span></button>
      <button data-t="rota">Em rota <span class="n hide" id="n-rota"></span></button>
      <button data-t="feitas">Entregues</button>
    </div>
    <div id="lista"></div>
    <p class="small muted center" id="upd" style="margin-top:10px"></p>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js?v=43432"></script>
<script src="app.js?v=43432"></script>
<script>
(async () => {
  const { $, esc, brl, km, ic } = GP;
  const sb = GP.client(false);
  $('e-ic').innerHTML = ic('bike'); $('b-sair').innerHTML = ic('logout');

  let cod = GP.ls.get('gp_moto_cod', ''), nome = GP.ls.get('gp_moto_nome', '');
  let info = null, lista = [], aba = 'retirar', conhecidos = null, timer = null, rt = null, ultCarga = 0;
  const meu = (p) => !p.entregador_nome || p.entregador_nome.toLowerCase() === nome.toLowerCase();

  const qc = new URLSearchParams(location.search).get('c');
  if (qc) { cod = qc.toUpperCase().replace(/[^A-Z0-9]/g, ''); history.replaceState(null, '', 'entregador.html'); }
  $('e-nome').value = nome;
  $('e-cod').addEventListener('input', (e) => {
    const v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
    e.target.value = v.length > 4 ? v.slice(0, 4) + '-' + v.slice(4) : v;
  });

  function sair(msg) {
    clearInterval(timer); if (rt) rt.parar(); rt = null; GP.ls.del('gp_moto_cod'); cod = ''; info = null;
    $('v-app').classList.add('hide'); $('v-entry').classList.remove('hide');
    $('e-cod').value = ''; if (msg) GP.toast(msg, 'err');
  }
  $('b-sair').onclick = async () => { if (await GP.confirmar('Sair da área de entregas?', { texto: 'Para entrar de novo você vai precisar do código da loja.', ok: 'Sair', icone: 'logout' })) sair(); };

  async function entrar(c) {
    const { data, error } = await sb.rpc('ff_entregador_entrar', { p_codigo: c });
    if (error) return GP.err(error);
    info = data; cod = c; GP.ls.set('gp_moto_cod', c);
    $('v-entry').classList.add('hide'); $('v-app').classList.remove('hide');
    const l = info.loja;
    $('h-loja').textContent = l.nome;
    if (l.imagem_url) { $('h-lg').style.backgroundImage = `url('${l.imagem_url}')`; $('h-lg').textContent = ''; } else $('h-lg').textContent = l.nome.trim()[0];
    await carregar();
    if (rt) rt.parar();
    rt = GP.ouvir(sb, 'entregas-' + c, () => { if (cod) carregar(); });
    // Reserva: com o tempo real ligado, confere a cada 1 min; sem ele, a cada 15 s.
    clearInterval(timer); timer = setInterval(() => { if (!document.hidden && (!(rt && rt.ativo()) || Date.now() - ultCarga > 60e3)) carregar(); }, 15000);
    return null;
  }
  $('f-entry').onsubmit = async (e) => {
    e.preventDefault();
    const c = $('e-cod').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    nome = $('e-nome').value.trim();
    if (c.length !== 8) return GP.toast('O código tem 8 letras/números.', 'err');
    if (nome.length < 2) return GP.toast('Digite seu nome.', 'err');
    GP.ls.set('gp_moto_nome', nome);
    const b = $('e-btn'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    const err = await entrar(c);
    b.disabled = false; b.textContent = 'Entrar';
    if (err) GP.toast(err, 'err');
  };

  const beep = () => { try { const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 988; g.gain.setValueAtTime(.3, a.currentTime); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .4); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .4); } catch {} };

  async function carregar() {
    ultCarga = Date.now();
    const { data, error } = await sb.rpc('ff_entregador_pedidos', { p_codigo: cod });
    if (error) {
      if (/codigo_invalido/.test(error.message)) return sair('Seu código venceu ou foi trocado pela loja. Peça o novo código.');
      $('upd').textContent = 'Sem conexão. Tentando de novo…'; return;
    }
    const novos = data.filter(p => p.status === 'preparando').map(p => p.id);
    if (conhecidos && novos.some(id => !conhecidos.has(id))) { beep(); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); GP.toast('Nova entrega para retirar!', 'ok'); }
    conhecidos = new Set(novos);
    lista = data;
    const exp = new Date(info.expira);
    $('h-sub').textContent = `${nome} · acesso até ${GP.hora(exp)}`;
    $('upd').innerHTML = rt && rt.ativo() ? '<span style="color:var(--ok);font-weight:700">● Ao vivo</span> · atualiza na hora' : 'Atualizado às ' + GP.hora(new Date()) + ' · atualiza sozinho';
    render();
  }

  function render() {
    const rotaTodas = lista.filter(p => p.status === 'saiu');
    const by = { retirar: lista.filter(p => p.status === 'preparando'), rota: rotaTodas.filter(meu).concat(rotaTodas.filter(p => !meu(p))), feitas: lista.filter(p => p.status === 'entregue').reverse() };
    const nMeu = rotaTodas.filter(meu).length;
    [['retirar', by.retirar.length], ['rota', nMeu]].forEach(([k, n]) => { $('n-' + k).textContent = n; $('n-' + k).classList.toggle('hide', !n); });
    const arr = by[aba];
    if (!arr.length) {
      const t = { retirar: ['Nenhuma entrega para retirar', 'Quando a loja aceitar um pedido, ele aparece aqui.'], rota: ['Nenhuma entrega em rota', 'Depois de retirar um pedido, ele vem para cá.'], feitas: ['Nenhuma entrega hoje', 'As entregas finalizadas nas últimas 12h aparecem aqui.'] }[aba];
      $('lista').innerHTML = `<div class="empty"><div class="big">${ic('bike')}</div><h4>${t[0]}</h4><p>${t[1]}</p></div>`;
      return;
    }
    $('lista').innerHTML = arr.map(p => {
      if (p.status === 'saiu' && !meu(p)) return `<article class="card del" style="opacity:.65"><div class="top"><b style="font-size:1.1rem">#${p.numero}</b><span class="small muted">${esc(p.endereco)}</span><div class="grow"></div><span class="badge b-off"><i class="dot"></i>Com ${esc(p.entregador_nome)}</span></div></article>`;
      const rota = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=driving`;
      const waze = `https://waze.com/ul?ll=${p.lat},${p.lng}&navigate=yes`;
      const pago = p.pagamento === 'pix';
      return `<article class="card del">
        <div class="top"><b style="font-size:1.1rem">#${p.numero}</b><span class="small muted">${GP.hora(p.criado_em)} · ${km(p.distancia_km)}</span><div class="grow"></div>
          <span class="badge ${GP.STATUS[p.status].c}"><i class="dot"></i>${p.status === 'preparando' ? 'Na loja' : GP.STATUS[p.status].t}</span></div>
        <div class="body">
          <div class="addr">${esc(p.endereco)}</div>
          ${p.complemento ? `<div class="small" style="margin-top:4px">${ic('home')} ${esc(p.complemento)}</div>` : ''}
          <div class="small muted" style="margin-top:6px">${ic('user')} ${esc(p.cliente_nome)}${p.entregador_nome && p.status !== 'preparando' ? ` · entregador: ${esc(p.entregador_nome)}` : ''}</div>
          ${pago ? `<div class="money paid">${ic('check')}<span class="grow">Já pago no Pix — não cobrar</span><span>${brl(p.total)}</span></div>`
            : p.pagamento === 'dinheiro' ? `<div class="money card">${ic('cash')}<span class="grow">Cobrar em dinheiro${GP.troco(p) > 0 ? `<br><small>Cliente paga com ${brl(p.troco_para)} · <b>levar ${brl(GP.troco(p))} de troco</b></small>` : '<br><small>Sem troco (valor certo)</small>'}</span><span>${brl(p.total)}</span></div>`
            : `<div class="money card">${ic('card')}<span class="grow">Cobrar no ${p.pagamento === 'debito' ? 'débito' : 'crédito'} · levar maquininha</span><span>${brl(p.total)}</span></div>`}
          <div class="its">${p.itens.map(i => `${i.qtd}× ${esc(i.nome)}${(i.opcoes || []).length ? ` <span class="muted">(${esc(i.opcoes.map(o => o.nome).join(', '))})</span>` : ''}`).join(' · ')}</div>
          ${p.observacao ? `<div class="small" style="margin-top:8px"><b>Obs.:</b> ${esc(p.observacao)}</div>` : ''}
          <button class="btn btn-ghost btn-sm btn-block" data-cupom="${p.id}" style="margin-top:10px">${ic('receipt')}Comprovante do pedido (imprimir / salvar PDF)</button>
          ${p.status !== 'entregue' ? `<div class="acts">
            <a class="btn btn-ghost btn-sm" href="${rota}" target="_blank" rel="noopener">${ic('pin')}Google Maps</a>
            <a class="btn btn-ghost btn-sm" href="${waze}" target="_blank" rel="noopener">${ic('bike')}Waze</a>
            <a class="btn btn-ghost btn-sm" href="tel:${GP.digits(p.cliente_telefone)}">${ic('phone')}Ligar</a>
            <a class="btn btn-ghost btn-sm" href="${GP.wa(p.cliente_telefone, `Olá ${p.cliente_nome}! Sou ${nome}, entregador da ${info.loja.nome}. Estou com seu pedido #${p.numero}.`)}" target="_blank" rel="noopener">${ic('chat')}WhatsApp</a>
          </div>` : `<div class="small muted" style="margin-top:8px">Entregue às ${GP.hora(p.atualizado_em)}</div>`}
        </div>
        ${p.status === 'preparando' ? `<div class="main"><button class="btn btn-primary" data-id="${p.id}" data-st="saiu">${ic('bike')}Peguei, saindo para entrega</button></div>` : ''}
        ${p.status === 'saiu' ? `<div class="main"><button class="btn btn-ok" data-id="${p.id}" data-st="entregue">${ic('check')}Confirmar entrega</button></div>` : ''}
      </article>`;
    }).join('');
  }
  $('seg').onclick = (e) => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    aba = b.dataset.t; document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b)); render();
  };
  $('lista').onclick = async (e) => {
    const cp = e.target.closest('[data-cupom]');
    if (cp) {
      const p = lista.find(x => x.id === cp.dataset.cupom);
      const larg = (GP.ls.get('gp_print', {}) || {}).largura || '80';
      if (p) GP.imprimirCupom(GP.cupom(p, info.loja, { vias: 'entrega', largura: larg }));
      return;
    }
    const b = e.target.closest('[data-st]'); if (!b) return;
    const st = b.dataset.st;
    if (st === 'entregue' && !(await GP.confirmar('Pedido entregue?', { texto: 'Confirme só depois de entregar ao cliente' + (lista.find(x => x.id === b.dataset.id) && lista.find(x => x.id === b.dataset.id).pagamento !== 'pix' ? ' e receber o pagamento.' : '.'), ok: 'Sim, entreguei', perigo: false, icone: 'check' }))) return;
    b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    const { error } = await sb.rpc('ff_entregador_status', { p_codigo: cod, p_pedido: b.dataset.id, p_status: st, p_nome: nome });
    if (error) { GP.toast(GP.err(error), 'err'); if (/codigo_invalido/.test(error.message)) return sair(); return carregar(); }
    GP.toast(st === 'saiu' ? 'Boa entrega! O cliente já foi avisado.' : 'Entrega confirmada!', 'ok');
    if (st === 'saiu') { aba = 'rota'; document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x.dataset.t === 'rota')); }
    carregar();
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && cod && info) carregar(); });

  if (cod && nome) { const err = await entrar(cod); if (err) sair(err === GP.err({ message: 'codigo_invalido' }) ? 'Código vencido ou trocado. Peça o novo para a loja.' : err); }
  else {
    $('v-entry').classList.remove('hide');
    if (cod) { $('e-cod').value = cod.slice(0, 4) + (cod.length > 4 ? '-' + cod.slice(4) : ''); $('e-nome').focus(); }
  }
})();
</script>
</body>
</html>
