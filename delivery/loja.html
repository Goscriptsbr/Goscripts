<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cardápio · GoPedido</title>
<meta name="theme-color" content="#F2451C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="app.css?v=42782">
<style>
  body{padding-bottom:100px}
  @media(max-width:380px){.topbar .logo span{display:none}#b-bag{padding:0 12px}}
  .cover{height:220px;background:linear-gradient(135deg,#FFB199,#F2451C) center/cover;position:relative}
  .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35))}
  @media(max-width:600px){.cover{height:160px}}
  .head{position:relative;margin-top:-56px;z-index:2}
  .head .card{padding:20px;display:flex;gap:18px;align-items:flex-start}
  .head .lg{width:92px;height:92px;border-radius:22px;background:#fff center/cover;border:1px solid var(--line);flex:none;display:grid;place-items:center;font-size:2rem;font-weight:800;color:var(--brand);box-shadow:var(--sh)}
  .head h1{font-size:clamp(1.4rem,3vw,1.9rem);letter-spacing:-.03em;line-height:1.1}
  .head .desc{color:var(--ink-2);margin:6px 0 12px}
  .head .chips{display:flex;flex-wrap:wrap;gap:8px}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:.88rem;color:var(--ink-2);margin:2px 0 12px}
  .meta>*{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .meta>*+*::before{content:'';width:4px;height:4px;border-radius:50%;background:#C9C5BC;margin-right:5px}
  .meta svg{width:15px;height:15px;color:var(--muted)}
  .meta a{color:inherit;text-decoration:none}
  .meta .rt b{color:var(--ink)}
  .meta .rt .stars{color:#F5A623}
  .infos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
  @media(min-width:760px){.infos{grid-template-columns:repeat(4,1fr)}}
  .inf{background:var(--bg);border-radius:14px;padding:10px 12px;min-width:0}
  .inf span{display:block;font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .inf b{display:block;font-size:.86rem;margin-top:2px;line-height:1.3}
  .stbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
  .horas2 summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;color:var(--ink-2)}
  .horas2 summary::-webkit-details-marker{display:none}
  .horas2 summary .chv{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-3px 2px 0 2px;transition:transform .2s}
  .horas2[open] summary .chv{transform:rotate(-135deg);margin-top:3px}
  .horas2>div{margin-top:8px;background:var(--bg);border-radius:12px;padding:8px 12px;max-width:340px;font-size:.86rem}
  .horas2>div>div{display:flex;justify-content:space-between;padding:3px 0;color:var(--ink-2)}
  .horas2 .hoje{font-weight:800;color:var(--ink)}
  .stwrap{width:100%}
  .lojaend2{display:flex;gap:10px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:.84rem;color:var(--ink-2)}
  .lojaend2 svg{flex:none;color:var(--muted)}
  .lojaend2 .t{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .revs{margin-top:16px}
  .revs-h{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .revs-h h2{font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
  .revs-h .stars{color:#F5A623}
  .revs-h a{margin-left:auto;font-size:.84rem;font-weight:800;color:var(--brand-2);text-decoration:none}
  .revs-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px;scroll-snap-type:x mandatory}
  .revs-row::-webkit-scrollbar{display:none}
  .rcard{flex:none;width:260px;padding:14px;scroll-snap-align:start}
  .rcard .top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .rcard .av{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-2);display:grid;place-items:center;font-weight:800;flex:none}
  .rcard .nm{font-weight:700;font-size:.86rem}
  .rcard .dt{font-size:.72rem;color:var(--muted)}
  .rcard p{font-size:.86rem;color:var(--ink-2);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .rnew{display:flex;gap:12px;align-items:center;padding:14px}
  .rnew .big{font-size:1.6rem}
  @media(max-width:600px){.head .card{flex-direction:column;gap:12px}.head .lg{width:76px;height:76px;margin-top:-50px}}
  .alert{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600;font-size:.9rem;display:flex;gap:10px;align-items:center}
  .horas{margin-top:12px;font-size:.88rem}
  .horas summary{display:flex;gap:6px;align-items:center;flex-wrap:wrap;cursor:pointer;font-weight:700;list-style:none}
  .horas summary::-webkit-details-marker{display:none}
  .horas>div{margin-top:8px;background:var(--bg);border-radius:12px;padding:8px 12px;max-width:340px}
  .horas>div>div{display:flex;justify-content:space-between;padding:3px 0;color:var(--ink-2)}
  .horas .hoje{font-weight:800;color:var(--ink)}
  .grp{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  .grp-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .grp-h b{flex:1}
  .grp-h .req{font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--ink);color:#fff}
  .grp-h .req.ok{background:var(--ok)}
  .grp-h .req.opt{background:#E9E7E2;color:var(--ink-2)}
  .gopt{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #F0EEEA;cursor:pointer}
  .gopt:last-child{border-bottom:0}
  .gopt input{width:20px;height:20px;accent-color:var(--brand);flex:none}
  .gopt span{flex:1}
  .gopt em{font-style:normal;font-weight:700;color:var(--ink-2);font-size:.9rem}
  .gopt.dis{opacity:.4;pointer-events:none}
  .promo-old{text-decoration:line-through;color:var(--muted);font-weight:500;font-size:.85em;margin-left:6px}
  .promo-tag{display:inline-block;background:var(--bad);color:#fff;border-radius:6px;font-size:.7rem;font-weight:800;padding:2px 6px;margin-left:6px;vertical-align:2px}
  .prod .ph .ptag{position:absolute;left:6px;top:6px;background:var(--bad);color:#fff;border-radius:8px;font-size:.72rem;font-weight:800;padding:2px 7px}
  .cupbox{background:var(--bg);border-radius:14px;padding:12px;margin-top:6px}
  .bagbar.pulse{animation:pulse .5s}
  @keyframes pulse{50%{transform:translate(-50%,0) scale(1.05)}}
  .head .card>.grow{align-self:stretch;min-width:0;max-width:100%}
  .btn.is-off{opacity:.55;box-shadow:none}
  .need{animation:need .5s;outline:2.5px solid var(--bad);outline-offset:3px;border-radius:14px}
  .need .input,.need.input{border-color:var(--bad)!important;box-shadow:0 0 0 4px rgba(217,45,32,.12)!important}
  @keyframes need{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .lojaend{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:.88rem;color:var(--ink-2);flex-wrap:wrap}
  .lojaend .grow{min-width:160px}
  .modo-ent{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#ECEAE6;border-radius:14px;padding:4px;margin-bottom:14px}
  .modo-ent button{height:46px;border-radius:11px;font-weight:800;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:center}
  .modo-ent button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
  .rev{padding:14px 0;border-top:1px solid var(--line)}
  .rev:first-of-type{border-top:0}
  .rev .resp{background:var(--bg);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:.86rem}
  .alert.off{background:#F1F0ED;color:var(--ink-2)}

  .catnav{position:sticky;top:64px;z-index:30;background:var(--bg);padding:12px 0;margin-top:16px;border-bottom:1px solid var(--line)}
  .catnav .in{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .catnav .in::-webkit-scrollbar{display:none}
  .catnav .chip{cursor:pointer;flex:none}
  .catnav .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .catnav .search{flex:none;display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted)}
  .catnav .search input{border:0;outline:0;background:none;width:130px;font-size:.84rem;color:var(--ink)}

  .cat h2{font-size:1.15rem;font-weight:800;margin:26px 0 12px;letter-spacing:-.01em;scroll-margin-top:130px}
  .prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  @media(max-width:400px){.prods{grid-template-columns:1fr}}
  .prod{display:flex;gap:14px;padding:14px;cursor:pointer;transition:box-shadow .15s,transform .15s;text-align:left;width:100%}
  .prod:hover{box-shadow:var(--sh-lg);transform:translateY(-2px)}
  .prod .tx{flex:1;min-width:0;display:flex;flex-direction:column}
  .prod h3{font-size:.98rem;font-weight:700}
  .prod p{color:var(--muted);font-size:.85rem;margin:4px 0 10px}
  .prod .pr{margin-top:auto;font-weight:800}
  .prod .ph{width:108px;height:108px;border-radius:14px;background:#F1EFEA center/cover;flex:none;position:relative}
  .prod .ph .add{position:absolute;right:6px;bottom:6px;width:32px;height:32px;border-radius:10px;background:#fff;color:var(--brand);display:grid;place-items:center;box-shadow:var(--sh)}
  .prod .inbag{display:inline-flex;margin-left:8px}
  .prod.off{opacity:.5;pointer-events:none}

  .bagbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:50;width:min(560px,calc(100% - 28px));height:60px;border-radius:18px;background:var(--brand);color:#fff;display:flex;align-items:center;gap:12px;padding:0 10px 0 18px;box-shadow:0 14px 34px rgba(242,69,28,.4);font-weight:700;transition:transform .25s}
  .bagbar.hidden{transform:translate(-50%,140%)}
  .bagbar .n{background:rgba(255,255,255,.22);border-radius:10px;min-width:30px;height:30px;display:grid;place-items:center;font-size:.88rem}
  .bagbar .go{margin-left:auto;background:#fff;color:var(--brand-2);height:42px;padding:0 16px;border-radius:12px;display:flex;align-items:center;gap:6px}

  /* modal produto */
  .pm-img{height:240px;background:#F1EFEA center/cover;flex:none}
  .pm-close{position:absolute;right:12px;top:12px;z-index:3;width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:var(--sh)}

  /* checkout */
  .steps{display:flex;gap:6px;padding:12px 18px 0}
  .steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
  .steps i.on{background:var(--brand)}
  .bag-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
  .bag-item:last-child{border-bottom:0}
  .bag-item .th{width:54px;height:54px;border-radius:12px;background:#F1EFEA center/cover;flex:none}
  .fee{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--bg);margin-top:12px;font-size:.9rem}
  .fee.bad{background:var(--bad-soft);color:var(--bad)}
  .fee.ok{background:var(--ok-soft);color:#0d6b41}
  .pixbox{border:1.5px dashed #F7A58C;background:#FFF9F6;border-radius:16px;padding:16px;margin-top:4px}
  .pixbox .qr{width:200px;height:200px;margin:6px auto 10px;background:#fff;border-radius:12px;padding:6px;border:1px solid var(--line)}
  .pixbox .qr svg{width:100%;height:100%}
  .keyrow{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;margin-top:8px}
  .keyrow code{flex:1;min-width:0;font-family:ui-monospace,Menlo,monospace;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px;border:1.5px dashed var(--line);border-radius:14px;background:#fff;cursor:pointer;text-align:center;margin-top:14px;transition:border .15s}
  .drop:hover{border-color:var(--brand)}
  .drop.done{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:#0d6b41}
  .drop .ic{width:44px;height:44px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
  .drop.done .ic{background:#fff;color:var(--ok)}
  .lock{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem;margin-top:10px}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="icon-btn" href="./" id="b-back" aria-label="Voltar"></a>
    <a class="logo" href="./"><b id="lg"></b><span>Go<em>Pedido</em></span></a>
    <div class="grow"></div>
    <a class="icon-btn" href="conta.html" id="b-conta" aria-label="Minha conta"></a>
    <button class="btn btn-ghost btn-sm" id="b-bag"></button>
  </div>
</header>

<div id="page">
  <div class="cover" id="cover"></div>
  <div class="wrap head">
    <div class="card">
      <div class="lg" id="s-logo"></div>
      <div class="grow">
        <h1 id="s-nome"><span class="sk" style="display:block;height:30px;width:220px"></span></h1>
        <p class="desc" id="s-desc"></p>
        <div class="meta" id="s-meta"></div>
        <div class="infos" id="s-infos"></div>
        <div class="stbar" id="s-stbar"></div>
        <div id="s-alert"></div>
        <div class="lojaend2 hide" id="s-end"></div>
        <div id="s-cupons" class="hide" style="margin-top:14px"><b class="small" style="display:block;margin-bottom:8px">🎟️ Cupons disponíveis</b><div class="tickets" id="tk-loja"></div></div>
      </div>
    </div>
  </div>
  <div class="wrap revs" id="revs"></div>
  <nav class="catnav"><div class="wrap in" id="catnav"></div></nav>
  <main class="wrap" id="menu"></main>
  <section class="wrap" id="reviews" style="margin-top:30px"></section>
  <div class="wrap center" style="padding:26px 18px 10px"><button class="small muted" id="b-denuncia" style="text-decoration:underline">⚠ Denunciar esta loja</button></div>
</div>

<button class="bagbar hidden" id="bagbar">
  <span class="n" id="bb-n">0</span><span id="bb-t">Ver sacola</span>
  <span class="go"><span id="bb-v">R$ 0,00</span><span id="bb-ic"></span></span>
</button>

<div class="overlay" id="ov"></div>

<!-- Modal do produto -->
<div class="sheet modal" id="pm" role="dialog" aria-modal="true">
  <button class="pm-close" id="pm-x" aria-label="Fechar"></button>
  <div class="pm-img" id="pm-img"></div>
  <div class="sheet-body">
    <h3 id="pm-nome" style="font-size:1.3rem;letter-spacing:-.02em"></h3>
    <p id="pm-desc" class="muted" style="margin:6px 0 10px"></p>
    <p id="pm-preco" style="font-weight:800;font-size:1.1rem"></p>
    <div id="pm-grupos"></div>
    <label class="field" style="margin-top:16px"><span>Alguma observação?</span>
      <textarea class="input" id="pm-obs" maxlength="200" placeholder="Ex.: sem cebola, ponto da carne…" style="min-height:70px"></textarea></label>
  </div>
  <div class="sheet-foot row">
    <div class="qty"><button id="pm-m" aria-label="Menos"></button><span id="pm-q">1</span><button id="pm-p" aria-label="Mais"></button></div>
    <button class="btn btn-primary grow" id="pm-add"></button>
  </div>
</div>

<!-- Checkout -->
<aside class="sheet tall" id="co" role="dialog" aria-modal="true">
  <div class="sheet-head">
    <button class="icon-btn" id="co-back" aria-label="Voltar"></button>
    <h3 id="co-title">Sua sacola</h3>
    <button class="icon-btn" id="co-x" aria-label="Fechar"></button>
  </div>
  <div class="steps"><i id="st1"></i><i id="st2"></i><i id="st3"></i></div>
  <div class="sheet-body">
    <!-- 1. sacola -->
    <section id="step1">
      <div id="bag-list"></div>
      <button class="btn btn-soft btn-block btn-sm" id="b-mais" style="margin-top:10px"></button>
      <div class="divider"></div>
      <div class="sum-row"><span>Subtotal</span><b id="s1-sub"></b></div>
      <div class="sum-row muted small"><span>Taxa de entrega</span><span>calculada no próximo passo</span></div>
      <p class="small muted" id="s1-min" style="margin-top:8px"></p>
    </section>

    <!-- 2. entrega -->
    <section id="step2" class="hide">
      <div id="c-login" class="fee" style="margin:0 0 14px"></div>
      <div class="grid2">
        <label class="field"><span>Seu nome</span><input class="input" id="c-nome" autocomplete="name" maxlength="80" placeholder="Como te chamamos?"></label>
        <label class="field"><span>WhatsApp</span><input class="input" id="c-tel" inputmode="tel" autocomplete="tel" placeholder="(19) 99999-9999"></label>
      </div>
      <div class="modo-ent hide" id="c-modo">
        <button type="button" data-m="entrega" class="on"></button>
        <button type="button" data-m="retirada"></button>
      </div>
      <div id="c-ret" class="hide"></div>
      <div id="c-entrega">
      <div id="c-saved-wrap" class="hide"><b class="small" style="display:block;margin-bottom:8px">Seus endereços</b><div class="saved" id="c-saved"></div></div>
      <b class="small" style="display:block;margin:4px 0 10px">Endereço de entrega</b>
      <div id="c-addr"></div>
      <label class="check hide" id="c-save-wrap"><input type="checkbox" id="c-save" checked>Salvar este endereço na minha conta</label>
      <div id="c-fee"></div>
      </div>
      <label class="field" style="margin-top:14px"><span>Observação do pedido <span class="muted">(opcional)</span></span>
        <textarea class="input" id="c-obs" maxlength="300" placeholder="Ex.: troco, interfone quebrado…" style="min-height:64px"></textarea></label>
    </section>

    <!-- 3. pagamento -->
    <section id="step3" class="hide">
      <b class="small" style="display:block;margin-bottom:10px">Como você quer pagar?</b>
      <div id="pay-opts"></div>
      <div id="din-area" class="hide" style="margin-bottom:6px">
        <label class="field" style="margin-bottom:8px"><span>Vai precisar de troco? Troco para quanto?</span><div class="prefix"><i>R$</i><input class="input" id="c-troco" placeholder="0,00"></div><small id="troco-msg"></small></label>
        <label class="check"><input type="checkbox" id="c-semtroco">Não preciso de troco (vou pagar o valor certo)</label>
      </div>
      <div id="pix-area" class="hide">
        <div class="pixbox">
          <div class="center"><b>Pague <span id="pix-val"></span> com Pix</b><p class="small muted">Escaneie o QR Code ou use o copia e cola</p></div>
          <div class="qr" id="pix-qr"></div>
          <button class="btn btn-dark btn-block btn-sm" id="pix-copy-cc"></button>
          <div class="keyrow">
            <div class="grow"><div class="small muted" id="pix-tipo">Chave Pix</div><code id="pix-key"></code></div>
            <button class="btn btn-ghost btn-sm" id="pix-copy-key"></button>
          </div>
          <p class="small muted" style="margin-top:8px" id="pix-nome"></p>
        </div>
        <input type="file" id="pix-file" accept="image/*,application/pdf" hidden>
        <label class="drop" for="pix-file" id="pix-drop"></label>
        <div class="lock" id="pix-lock"></div>
      </div>
      <div class="divider"></div>
      <div class="cupbox">
        <div id="co-cupons" class="hide"><b class="small" style="display:block;margin-bottom:8px">Escolha um cupom</b><div class="tickets" id="tk-co" style="margin-bottom:10px"></div></div>
        <div class="row" style="gap:8px"><div class="grow"><input class="input" id="c-cupom"  placeholder="Tem outro código de cupom?" maxlength="20" style="text-transform:uppercase"></div><button class="btn btn-dark" id="b-cupom" type="button">Aplicar</button></div>
        <div class="small" id="cupom-msg" style="margin-top:6px"></div>
      </div>
      <div class="divider"></div>
      <div class="sum-row"><span>Subtotal</span><span id="s3-sub"></span></div>
      <div class="sum-row"><span>Entrega <span class="muted small" id="s3-dist"></span></span><span id="s3-fee"></span></div>
      <div class="sum-row hide" id="s3-desc-row" style="color:var(--ok)"><span id="s3-desc-lb">Desconto</span><span id="s3-desc"></span></div>
      <div class="sum-row total"><span>Total</span><span id="s3-tot"></span></div>
    </section>
  </div>
  <div class="sheet-foot">
    <button class="btn btn-primary btn-block" id="co-next">Continuar</button>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js?v=42782"></script>
<script src="app.js?v=42782"></script>
<script>
(async () => {
  const { $, esc, brl, km, ic } = GP;
  const sb = GP.client('cliente');
  $('lg').innerHTML = ic('bag'); $('b-back').innerHTML = ic('left');
  $('pm-x').innerHTML = ic('x'); $('pm-m').innerHTML = ic('minus'); $('pm-p').innerHTML = ic('plus');
  $('co-x').innerHTML = ic('x'); $('co-back').innerHTML = ic('left'); $('bb-ic').innerHTML = ic('right');
  $('b-conta').innerHTML = ic('user');
  $('pix-copy-cc').innerHTML = ic('copy') + 'Copiar código Pix (copia e cola)';
  $('pix-copy-key').innerHTML = ic('copy') + 'Copiar';
  GP.phoneMask($('c-tel'));

  const slug = new URLSearchParams(location.search).get('l');
  const fail = (t, d) => { $('page').innerHTML = `<div class="wrap"><div class="empty" style="padding-top:90px"><div class="big">${ic('store')}</div><h4>${t}</h4><p>${d}</p><a class="btn btn-primary" href="./" style="margin-top:18px">Ver outras lojas</a></div></div>`; };
  if (!slug) return fail('Loja não informada', 'Abra a loja pela página inicial.');

  const { data: loja, error } = await sb.from('ff_lojas').select('*').eq('slug', slug).eq('ativa', true).maybeSingle();
  if (error) return fail('Não foi possível abrir a loja', esc(GP.err(error)));
  if (!loja) return fail('Loja não encontrada', 'O link pode estar errado ou a loja saiu do ar.');
  const { data: prods } = await sb.from('ff_produtos').select('*').eq('loja_id', loja.id).order('ordem').order('nome');
  const { data: etapasLoja } = await sb.from('ff_etapas').select('*').eq('loja_id', loja.id);
  const ET = {}; (etapasLoja || []).forEach(e => ET[e.id] = { id: 'e:' + e.id, nome: e.nome, min: e.min, max: e.max, opcoes: e.opcoes || [] });
  (prods || []).forEach(p => { p.grupos = GP.grupos(p).concat((p.etapas_ids || []).map(id => ET[id]).filter(Boolean)); });
  const P = {}; (prods || []).forEach(p => P[p.id] = p);
  document.title = `${loja.nome} · GoPedido`;
  const ST = () => GP.statusLoja(loja);

  // ---------- Cabeçalho ----------
  if (loja.capa_url || loja.imagem_url) $('cover').style.backgroundImage = `url('${loja.capa_url || loja.imagem_url}')`;
  if (loja.imagem_url) $('s-logo').style.backgroundImage = `url('${loja.imagem_url}')`;
  else $('s-logo').textContent = loja.nome.trim()[0].toUpperCase();
  $('s-nome').innerHTML = esc(loja.nome) + (loja.verificacao === 'verificada' ? ` <span class="verif" title="Loja verificada pelo GoPedido">${ic('check')}Verificada</span>` : '');
  if (loja.verificacao !== 'verificada') $('s-stbar').insertAdjacentHTML('beforebegin', `<div class="alert off" style="background:var(--warn-soft);color:#7a4f0e">${ic('shield')}<span>Esta loja está em análise e ainda não aparece para os clientes nem recebe pedidos.</span></div>`);
  if (loja.lat != null) {
    $('s-end').classList.remove('hide');
    $('s-end').innerHTML = `${ic('pin')}<span class="t">${esc(loja.endereco || 'Localização da loja')}</span><a class="btn btn-ghost btn-sm" style="flex:none" target="_blank" rel="noopener" href="${GP.mapsLink(loja.lat, loja.lng)}">${ic('ext')}Ver no mapa</a>`;
  }
  $('s-desc').textContent = loja.descricao || '';
  if (loja.cnpj) $('s-end').insertAdjacentHTML('afterend', `<p class="small muted" style="margin-top:10px">CNPJ ${esc(GP.fmtCnpj(loja.cnpj))}</p>`);
  const pags = [loja.aceita_pix && 'Pix', loja.aceita_debito && 'Débito', loja.aceita_credito && 'Crédito', loja.aceita_dinheiro !== false && loja.aceita_dinheiro != null && 'Dinheiro'].filter(Boolean);
  const nota = loja.nota_qtd ? String(loja.nota_media).replace('.', ',') : null;
  $('s-meta').innerHTML = [
    nota ? `<a class="rt" href="#revs"><span class="stars">★</span><b>${nota}</b><span class="muted">(${loja.nota_qtd})</span></a>` : '<span>✨ Novo no GoPedido</span>',
    `<span>${ic('clock')}${esc(loja.tempo_entrega || '30–50 min')}</span>`,
    loja.verificacao === 'verificada' ? `<span>${ic('shield')}Loja verificada</span>` : ''
  ].filter(Boolean).join('');
  $('s-infos').innerHTML = [
    ['Entrega', GP.regraEntrega(loja)],
    ['Pedido mínimo', Number(loja.pedido_minimo) ? brl(loja.pedido_minimo) : 'Sem mínimo'],
    ['Pagamento', [loja.aceita_pix && 'Pix', (loja.aceita_debito || loja.aceita_credito) && 'Cartão', loja.aceita_dinheiro && 'Dinheiro'].filter(Boolean).join(' · ') || '—'],
    ['Retirada', loja.aceita_retirada ? 'Grátis na loja' : 'Só entrega']
  ].map(([l, v]) => `<div class="inf"><span>${l}</span><b>${esc(v)}</b></div>`).join('');
  const hojeDow = GP.agoraSP().dow, linH = GP.resumoHorarios(loja.horarios || {});
  $('s-stbar').innerHTML = `<details class="horas2 stwrap"><summary><span class="badge ${ST().cls}" id="s-status"><i class="dot"></i>${ST().texto}</span>${loja.horario_auto ? `<span>Horários</span><span class="chv"></span>` : ''}</summary>
    ${loja.horario_auto ? `<div>${GP.DIAS.map((d, i) => `<div class="${i === hojeDow ? 'hoje' : ''}"><span>${d}</span><span>${linH[i]}</span></div>`).join('')}</div>` : ''}</details>`;
  function renderAlert() {
    const st = ST();
    $('s-alert').innerHTML = st.aberta ? '' : `<div class="alert off">${ic('clock')}<span>Pedidos pausados agora. Você já pode olhar o cardápio e montar a sacola.</span></div>`;
    const b = $('s-status'); if (b) { b.className = 'badge ' + st.cls; b.innerHTML = '<i class="dot"></i>' + st.texto; }
  }
  renderAlert();
  setInterval(() => { renderAlert(); if ($('co').classList.contains('on')) updNext(); }, 30000);

  // ---------- Cupons públicos ----------
  let cuponsPub = [];
  try { const r = await sb.rpc('ff_cupons_publicos', { p_loja: loja.id }); cuponsPub = r.data || []; } catch {}
  const ticket = (c, ctx) => {
    const on = cupom && cupom.codigo === c.codigo;
    const falta = ctx === 'co' && Number(c.minimo) > subtotal();
    return `<button type="button" class="ticket ${on ? 'on' : ''} ${falta ? 'dis' : ''}" data-tk="${esc(c.codigo)}">
      <span class="tk-l">${GP.descCupom(c).replace(' OFF', '<br>OFF')}</span>
      <span class="tk-r"><code>${esc(c.codigo)}</code><span class="small">${esc(GP.regrasCupom(c))}</span>
      <span class="tk-act">${on ? '✓ Aplicado' : falta ? `Faltam ${brl(Number(c.minimo) - subtotal())}` : ctx === 'co' ? 'Toque para usar' : 'Usar no pedido'}</span></span></button>`;
  };
  function renderTickets() {
    $('s-cupons').classList.toggle('hide', !cuponsPub.length);
    $('tk-loja').innerHTML = cuponsPub.map(c => ticket(c, 'loja')).join('');
    $('co-cupons').classList.toggle('hide', !cuponsPub.length);
    $('tk-co').innerHTML = cuponsPub.map(c => ticket(c, 'co')).join('');
  }
  let cupomPendente = null;
  $('tk-loja').onclick = (e) => {
    const b = e.target.closest('[data-tk]'); if (!b) return;
    cupomPendente = b.dataset.tk;
    GP.toast(`Cupom ${cupomPendente} separado! Ele será aplicado no pagamento.`, 'ok');
    renderTickets();
  };

  // ---------- Cardápio ----------
  const cats = [];
  (prods || []).forEach(p => { if (!cats.includes(p.categoria)) cats.push(p.categoria); });
  let busca = '';
  function cardProd(p) {
        const n = qtdNo(p.id);
        return `<button class="card prod ${p.disponivel ? '' : 'off'}" data-p="${p.id}">
          <div class="tx"><h3>${esc(p.nome)}${n ? `<span class="badge b-brand inbag">${n}×</span>` : ''}</h3>
          <p class="clamp2">${esc(p.descricao)}</p>
          <div class="pr">${!p.disponivel ? '<span class="muted">Indisponível</span>' : (temMin(p) ? '<span class="small muted" style="font-weight:600">a partir de </span>' : '') + (GP.emPromo(p) ? `<span style="color:var(--bad)">${brl(GP.precoAtual(p) + minExtra(p))}</span><span class="promo-old">${brl(Number(p.preco) + minExtra(p))}</span>` : brl(GP.precoAtual(p) + minExtra(p)))}</div></div>
          <div class="ph" style="${p.imagem_url ? `background-image:url('${esc(p.imagem_url)}')` : ''}">${GP.emPromo(p) ? `<span class="ptag">-${GP.descPct(p)}%</span>` : ''}${p.imagem_url ? '' : `<span style="position:absolute;inset:0;display:grid;place-items:center;color:#c9c5bc">${ic('image')}</span>`}<span class="add">${ic('plus')}</span></div>
        </button>`;
  }
  // preço mínimo das escolhas obrigatórias (para o "a partir de")
  const minExtra = (p) => GP.grupos(p).filter(g => Number(g.min) > 0).reduce((t, g) => t + Math.min(...(g.opcoes || []).map(o => Number(o.preco) || 0)), 0);
  const temMin = (p) => GP.grupos(p).some(g => Number(g.min) > 0 && (g.opcoes || []).some(o => Number(o.preco) > Math.min(...g.opcoes.map(x => Number(x.preco) || 0))));
  function renderMenu() {
    const q = busca.toLowerCase();
    const lst = (prods || []).filter(p => !q || (p.nome + ' ' + p.descricao).toLowerCase().includes(q));
    if (!lst.length) {
      $('menu').innerHTML = `<div class="empty"><div class="big">${ic('menu')}</div><h4>${prods && prods.length ? 'Nada encontrado' : 'Cardápio em preparação'}</h4><p>${prods && prods.length ? 'Tente outro termo.' : 'Esta loja ainda não cadastrou produtos.'}</p></div>`;
      return;
    }
    const promos = lst.filter(p => p.disponivel && GP.emPromo(p));
    const cards = (ps) => ps.map(p => cardProd(p)).join('');
    $('menu').innerHTML = (promos.length && !q ? `<section class="cat"><h2 id="cat-promo">🔥 Promoções</h2><div class="prods">${cards(promos)}</div></section>` : '') + cats.map((c, i) => {
      const ps = lst.filter(p => p.categoria === c);
      if (!ps.length) return '';
      return `<section class="cat"><h2 id="cat-${i}">${esc(c)}</h2><div class="prods">${cards(ps)}</div></section>`;
    }).join('');
  }
  $('catnav').innerHTML = `<label class="search">${ic('search')}<input id="m-q" placeholder="Buscar no cardápio"></label>` +
    ((prods || []).some(p => p.disponivel && GP.emPromo(p)) ? `<button class="chip" data-c="promo">🔥 Promoções</button>` : '') +
    cats.map((c, i) => `<button class="chip" data-c="${i}">${esc(c)}</button>`).join('');
  $('catnav').onclick = (e) => {
    const b = e.target.closest('[data-c]'); if (!b) return;
    const h = $('cat-' + b.dataset.c); if (h) h.scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.querySelectorAll('#catnav .chip').forEach(x => x.classList.toggle('on', x === b));
  };
  $('m-q').addEventListener('input', (e) => { busca = e.target.value.trim(); renderMenu(); });
  $('menu').onclick = (e) => { const b = e.target.closest('[data-p]'); if (b) openProd(P[b.dataset.p]); };

  // ---------- Sacola ----------
  const KEY = 'gp_bag_' + loja.id;
  let bag = (GP.ls.get(KEY, []) || []).filter(it => P[it.id] && P[it.id].disponivel)
    .filter(it => { const p = P[it.id]; return GP.grupos(p).every(g => { const n = (it.opcoes || []).filter(x => x.g === g.id).length; return n >= (Number(g.min) || 0) && n <= (Number(g.max) || 1); }) && GP.opcoesEscolhidas(p, it.opcoes).length === (it.opcoes || []).length; });
  const qtdNo = (id) => bag.filter(i => i.id === id).reduce((s, i) => s + i.qtd, 0);
  const precoIt = (it) => GP.precoItem(P[it.id], it.opcoes);
  const subtotal = () => Math.round(bag.reduce((s, i) => s + precoIt(i) * i.qtd, 0) * 100) / 100;
  const count = () => bag.reduce((s, i) => s + i.qtd, 0);
  function saveBag() {
    GP.ls.set(KEY, bag);
    const n = count();
    $('bb-n').textContent = n; $('bb-v').textContent = brl(subtotal());
    $('bagbar').classList.toggle('hidden', n === 0 || $('co').classList.contains('on'));
    $('b-bag').innerHTML = ic('bag') + `<span>${n ? brl(subtotal()) : 'Sacola'}</span>`;
    renderMenu();
  }

  // Modal produto
  let cur = null, curQ = 1;
  const ov = $('ov');
  const openSheet = (el) => { el.classList.add('on'); ov.classList.add('on'); document.body.style.overflow = 'hidden'; };
  const closeAll = () => { ['pm', 'co'].forEach(id => $(id).classList.remove('on')); ov.classList.remove('on'); document.body.style.overflow = ''; saveBag(); };
  ov.onclick = closeAll; $('pm-x').onclick = closeAll; $('co-x').onclick = closeAll;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(); });
  let escolha = {};   // grupoId -> [opcaoId]
  function openProd(p) {
    cur = p; curQ = 1; escolha = {};
    GP.grupos(p).forEach(g => { escolha[g.id] = []; if (Number(g.min) === 1 && Number(g.max) === 1 && g.opcoes.length === 1) escolha[g.id] = [g.opcoes[0].id]; });
    $('pm-img').style.backgroundImage = p.imagem_url ? `url('${p.imagem_url}')` : '';
    $('pm-img').style.display = p.imagem_url ? '' : 'none';
    $('pm-nome').textContent = p.nome; $('pm-desc').textContent = p.descricao || '';
    $('pm-preco').innerHTML = GP.emPromo(p) ? `<span style="color:var(--bad)">${brl(p.preco_promo)}</span><span class="promo-old">${brl(p.preco)}</span><span class="promo-tag">-${GP.descPct(p)}%</span>` : brl(p.preco);
    if (!Number(p.preco) && GP.grupos(p).length) $('pm-preco').innerHTML = '<span class="small muted">O preço depende das opções escolhidas</span>';
    $('pm-obs').value = '';
    renderGrupos(); updProd(); openSheet($('pm'));
    $('pm').querySelector('.sheet-body').scrollTop = 0;
  }
  const selList = () => Object.entries(escolha).flatMap(([g, os]) => os.map(o => ({ g, o })));
  const faltando = () => GP.grupos(cur).filter(g => (escolha[g.id] || []).length < (Number(g.min) || 0));
  function renderGrupos() {
    $('pm-grupos').innerHTML = GP.grupos(cur).map(g => {
      const sel = escolha[g.id] || [], max = Number(g.max) || 1, min = Number(g.min) || 0, um = max === 1;
      const okReq = sel.length >= min;
      return `<div class="grp" data-g="${g.id}">
        <div class="grp-h"><b>${esc(g.nome)}</b><span class="req ${min ? (okReq ? 'ok' : '') : 'opt'}">${min ? (okReq ? '✓ OK' : 'Obrigatório') : 'Opcional'}</span></div>
        <div class="small muted" style="margin:-4px 0 6px">${GP.regraGrupo(g)}${!um ? ` · ${sel.length}/${max} escolhido${sel.length === 1 ? '' : 's'}` : ''}</div>
        ${g.opcoes.map(o => {
          const on = sel.includes(o.id), dis = !um && !on && sel.length >= max;
          return `<label class="gopt ${dis ? 'dis' : ''}"><input type="${um ? 'radio' : 'checkbox'}" name="g-${g.id}" data-g="${g.id}" data-o="${o.id}" ${on ? 'checked' : ''}><span>${esc(o.nome)}</span>${Number(o.preco) ? `<em>+ ${brl(o.preco)}</em>` : ''}</label>`;
        }).join('')}
      </div>`;
    }).join('');
  }
  $('pm-grupos').addEventListener('change', (e) => {
    const g = e.target.dataset.g, o = e.target.dataset.o; if (!g) return;
    const grp = GP.grupos(cur).find(x => x.id === g), max = Number(grp.max) || 1;
    if (max === 1) escolha[g] = [o];
    else escolha[g] = e.target.checked ? [...new Set([...(escolha[g] || []), o])].slice(0, max) : (escolha[g] || []).filter(x => x !== o);
    renderGrupos(); updProd();
  });
  function updProd() {
    $('pm-q').textContent = curQ;
    const falta = faltando();
    const unit = GP.precoItem(cur, selList());
    $('pm-add').disabled = false;
    $('pm-add').classList.toggle('btn-dark', falta.length > 0);
    $('pm-add').classList.toggle('btn-primary', !falta.length);
    $('pm-add').innerHTML = falta.length ? `Escolha: ${esc(falta[0].nome)}` : `Adicionar · ${brl(unit * curQ)}`;
  }
  $('pm-m').onclick = () => { curQ = Math.max(1, curQ - 1); updProd(); };
  $('pm-p').onclick = () => { curQ = Math.min(99, curQ + 1); updProd(); };
  const chaveOps = (ops) => (ops || []).map(x => x.g + ':' + x.o).sort().join('|');
  $('pm-add').onclick = () => {
    if (faltando().length) { const g = faltando()[0]; const el = $('pm-grupos').querySelector(`.grp[data-g="${g.id}"]`); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); GP.toast('Escolha: ' + g.nome, 'err'); return; }
    const obs = $('pm-obs').value.trim(), opcoes = selList();
    const ex = bag.find(i => i.id === cur.id && i.obs === obs && chaveOps(i.opcoes) === chaveOps(opcoes));
    if (ex) ex.qtd = Math.min(99, ex.qtd + curQ); else bag.push({ id: cur.id, qtd: curQ, obs, opcoes });
    closeAll();
    GP.toast(`${cur.nome} na sacola! Continue escolhendo ou toque na sacola para finalizar.`, 'ok');
    $('bagbar').classList.remove('pulse'); void $('bagbar').offsetWidth; $('bagbar').classList.add('pulse');
  };

  // ---------- Checkout ----------
  let step = 1, map = null;
  const cli = GP.ls.get('gp_cliente', {});
  let pos = cli.lat != null ? { lat: cli.lat, lng: cli.lng } : (GP.ls.get('gp_pos') || null);
  let pag = null, comprovante = null, comprovanteTotal = null;
  $('c-nome').value = cli.nome || ''; $('c-tel').value = cli.telefone || '';
  let user = null, perfil = null, enderecos = [], endSel = null;
  const { data: { session } } = await sb.auth.getSession();
  user = session ? session.user : null;
  if (user) {
    const [{ data: pf }, { data: ends }] = await Promise.all([
      sb.from('ff_clientes').select('*').eq('id', user.id).maybeSingle(),
      sb.from('ff_enderecos').select('*').order('principal', { ascending: false }).order('criado_em', { ascending: false })
    ]);
    perfil = pf; enderecos = ends || [];
    if (perfil) { if (perfil.nome) $('c-nome').value = perfil.nome; if (perfil.telefone) $('c-tel').value = perfil.telefone; }
  }
  const voltar = encodeURIComponent('loja.html?l=' + slug);
  $('c-login').innerHTML = user
    ? `${ic('user')}<span class="grow">Entrou como <b>${esc((perfil && perfil.nome) || user.email)}</b></span><a class="small" style="font-weight:700;color:var(--brand-2)" href="conta.html">Minha conta</a>`
    : `${ic('user')}<span class="grow">Tem conta? Use seus endereços salvos.</span><a class="small" style="font-weight:700;color:var(--brand-2)" href="conta.html?voltar=${voltar}">Entrar</a>`;

  // distância pela rota (ruas); enquanto calcula, usa a estimativa
  let rotaKm = null, rotaPos = '', rotaCalc = false, rotaSeq = 0;
  async function calcRota() {
    if (!pos || loja.lat == null) return;
    const chave = pos.lat.toFixed(5) + ',' + pos.lng.toFixed(5);
    if (chave === rotaPos) return;
    rotaPos = chave; rotaKm = null; rotaCalc = true; const my = ++rotaSeq;
    renderFee(); updNext();
    const r = await GP.rota(loja.lat, loja.lng, pos.lat, pos.lng);
    if (my !== rotaSeq) return;
    rotaKm = r; rotaCalc = false;
    renderFee(); updNext(); if (step === 3) renderPag();
  }
  let modoEnt = 'entrega';
  const entrega = () => {
    if (modoEnt === 'retirada') return { d: 0, t: 0, fora: false, rota: false, calc: false, ret: true };
    if (!pos || loja.lat == null) return null;
    const reta = GP.dist(loja.lat, loja.lng, pos.lat, pos.lng);
    const d = GP.distEntrega(reta, rotaKm);
    return { d, t: GP.taxa(loja, d), fora: GP.foraArea(loja, d), rota: rotaKm != null && d === Math.round(rotaKm * 100) / 100, calc: rotaCalc };
  };
  let cupom = null;   // {codigo, tipo, valor, minimo}
  const descontoCalc = () => {
    if (!cupom) return 0;
    const e = entrega(), sub = subtotal(), taxa = e ? e.t : 0;
    const d = cupom.tipo === 'percentual' ? Math.round(sub * Math.min(Number(cupom.valor), 100)) / 100 : cupom.tipo === 'valor' ? Math.min(Number(cupom.valor), sub) : taxa;
    return Math.min(Math.round(d * 100) / 100, sub + taxa);
  };
  const total = () => { const e = entrega(); return Math.max(0, Math.round((subtotal() + (e ? e.t : 0) - descontoCalc()) * 100) / 100); };

  const openCheckout = () => {
    if (!count()) return GP.toast('Sua sacola está vazia');
    step = 1; renderStep(); openSheet($('co')); $('bagbar').classList.add('hidden');
  };
  $('bagbar').onclick = openCheckout; $('b-bag').onclick = openCheckout;
  $('co-back').onclick = () => { if (step > 1) { step--; renderStep(); } else closeAll(); };

  function renderStep() {
    ['step1', 'step2', 'step3'].forEach((s, i) => $(s).classList.toggle('hide', i + 1 !== step));
    ['st1', 'st2', 'st3'].forEach((s, i) => $(s).classList.toggle('on', i < step));
    $('co-title').textContent = ['Sua sacola', 'Entrega', 'Pagamento'][step - 1];
    $('co').querySelector('.sheet-body').scrollTop = 0;

  function renderBag() {

  $('bag-list').onclick = (e) => {

  let addr = null;

    $('c-ret').innerHTML = `<div class="fee ok" style="margin:0 0 14px">${ic('store')}<span class="grow"><b>Retirar na loja</b><br><span class="small">${esc(loja.endereco || '')}</span></span>${loja.lat != null ? `<a class="btn btn-soft btn-sm" target="_blank" rel="noopener" href="${GP.mapsLink(loja.lat, loja.lng)}">Ver no mapa</a>` : ''}</div><p class="small muted" style="margin:-6px 0 12px">Sem taxa de entrega. Avisamos quando o pedido estiver pronto.</p>`;
  }
  $('c-modo').querySelector('[data-m=entrega]').innerHTML = ic('bike') + 'Entrega';
  $('c-modo').querySelector('[data-m=retirada]').innerHTML = ic('store') + 'Retirar no local';
  $('c-modo').onclick = (e) => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    modoEnt = b.dataset.m; modoUI();
    if (modoEnt === 'entrega' && addr) { addr.refresh(); calcRota(); }
    renderFee(); updNext();
  };
  function renderEntrega() {
    modoUI();
    if (!addr) {
      addr = GP.addressForm($('c-addr'), {
        inicio: pos, centro: loja.lat != null ? { lat: loja.lat, lng: loja.lng } : null,
        onChange: (a) => { pos = a.pos; if (endSel && !a.get().rua) endSel = null; calcRota(); renderFee(); updNext(); }
      });

  function pickEnd(e) { endSel = e.id; addr.set(e); renderSaved(); }
  function renderSaved() {
    $('c-saved-wrap').classList.toggle('hide', !enderecos.length);
    $('c-saved').innerHTML = enderecos.map(e => `<button type="button" class="${endSel === e.id ? 'on' : ''}" data-e="${e.id}"><b>${ic('home')} ${esc(e.apelido || e.rua)}</b><span>${esc(e.rua)}, ${esc(e.numero)} - ${esc(e.bairro)}</span></button>`).join('')
      + (enderecos.length ? `<button type="button" data-e="novo"><b>${ic('plus')} Outro endereço</b><span>Digite um novo</span></button>` : '');

  }
  $('c-saved').onclick = (ev) => {
    const b = ev.target.closest('[data-e]'); if (!b) return;

    pickEnd(enderecos.find(e => e.id === b.dataset.e));
  };
  function renderFee() {
    const e = entrega();
    if (!e) { $('c-fee').innerHTML = `<div class="fee">${ic('pin')}<span>Marque sua localização para calcularmos a taxa de entrega.</span></div>`; return; }
    if (e.calc) { $('c-fee').innerHTML = `<div class="fee"><span class="spin" style="width:16px;height:16px;border-width:2px"></span><span>Calculando a rota até você…</span></div>`; return; }
    if (e.fora) { const lim = loja.taxa_modo === 'tabela' && GP.faixas(loja).length ? Number(GP.faixas(loja).slice(-1)[0].ate) : Number(loja.raio_km); $('c-fee').innerHTML = `<div class="fee bad">${ic('x')}<span>Você está a ${km(e.d)} da loja — fora da área de entrega${lim ? ' (até ' + km(lim) + ')' : ''}.</span></div>`; return; }
    $('c-fee').innerHTML = `<div class="fee ok">${ic('bike')}<span class="grow">${e.rota ? 'Rota de' : 'Cerca de'} <b>${km(e.d)}</b> até a loja${e.rota ? ' pelas ruas' : ''}</span><b>${e.t > 0 ? brl(e.t) : 'Grátis'}</b></div>`;
  }
  ['c-nome', 'c-tel'].forEach(id => $(id).addEventListener('input', updNext));

  function renderPag() {
    const ops = [
      loja.aceita_pix && ['pix', 'pix', 'Pix', 'Pague agora e anexe o comprovante'],
      loja.aceita_debito && ['debito', 'card', 'Cartão de débito', 'Pague na entrega, na maquininha'],
      loja.aceita_credito && ['credito', 'card', 'Cartão de crédito', 'Pague na entrega, na maquininha'],
      loja.aceita_dinheiro && ['dinheiro', 'cash', 'Dinheiro', 'Pague na entrega · informe se precisa de troco']
    ].filter(Boolean);
    if (pag && !ops.find(o => o[0] === pag)) pag = null;
    if (!pag && ops.length === 1) pag = ops[0][0];
    $('pay-opts').innerHTML = ops.length ? ops.map(o => `<label class="opt ${pag === o[0] ? 'on' : ''}">
      <input type="radio" name="pag" value="${o[0]}" ${pag === o[0] ? 'checked' : ''}>
      <span class="ic" style="color:${o[0] === 'pix' ? '#32BCAD' : 'var(--ink-2)'}">${ic(o[1])}</span>
      <span class="grow"><b>${o[2]}</b><div class="small muted">${o[3]}</div></span></label>`).join('')
      : '<p class="muted">Esta loja ainda não configurou formas de pagamento.</p>';
    if (comprovante && comprovanteTotal !== total()) { comprovante = null; GP.toast('O valor mudou: anexe um novo comprovante.'); }
    const e = entrega();
    $('s3-sub').textContent = brl(subtotal());
    $('s3-fee').textContent = e && e.t > 0 ? brl(e.t) : 'Grátis';
    $('s3-dist').textContent = e && e.ret ? '(retirada no local)' : e ? `(${km(e.d)})` : '';
    if (cupom && Number(cupom.minimo) > subtotal()) { cupom = null; $('b-cupom').textContent = 'Aplicar'; $('cupom-msg').innerHTML = '<span style="color:var(--bad)">O subtotal ficou abaixo do mínimo do cupom.</span>'; }
    const dsc = descontoCalc();
    $('s3-desc-row').classList.toggle('hide', !dsc);
    $('s3-desc').textContent = '-' + brl(dsc);
    $('s3-desc-lb').textContent = cupom ? `Desconto (${cupom.codigo})` : 'Desconto';
    $('s3-tot').textContent = brl(total());
    renderTickets();
    renderPix();
  }
  $('pay-opts').onchange = (e) => { pag = e.target.value; renderPag(); updNext(); };
  $('c-cupom').addEventListener('input', (e) => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  $('c-cupom').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('b-cupom').click(); } });
  async function aplicarCupom(code) {
    $('c-cupom').value = code;
    if (cupom && cupom.codigo === code) { cupom = null; $('c-cupom').value = ''; $('b-cupom').textContent = 'Aplicar'; $('cupom-msg').innerHTML = ''; renderPag(); updNext(); return; }
    cupom = null;
    await $('b-cupom').onclick();
  }
  $('tk-co').onclick = (e) => { const b = e.target.closest('[data-tk]'); if (b) aplicarCupom(b.dataset.tk); };
  $('b-cupom').onclick = async () => {
    const code = $('c-cupom').value.trim();
    if (cupom && (!code || code === cupom.codigo)) { cupom = null; $('c-cupom').value = ''; $('b-cupom').textContent = 'Aplicar'; $('cupom-msg').innerHTML = ''; renderPag(); updNext(); return; }
    if (!code) return GP.toast('Digite o código do cupom.');
    const b = $('b-cupom'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    const e = entrega();
    const { data, error } = await sb.rpc('ff_cupom_info', { p_loja: loja.id, p_codigo: code, p_sub: subtotal(), p_taxa: e ? e.t : 0, p_tel: $('c-tel').value });
    b.disabled = false; b.textContent = 'Aplicar';
    if (error || data.erro) {
      cupom = null;
      const msg = error ? GP.err(error) : data.erro === 'cupom_minimo' ? `Este cupom vale para pedidos a partir de ${brl(data.minimo)}.` : GP.err({ message: data.erro });
      $('cupom-msg').innerHTML = `<span style="color:var(--bad);font-weight:700">⚠ ${esc(msg)}</span>`;
    } else {
      cupom = data; b.textContent = 'Remover';
      $('cupom-msg').innerHTML = `<span style="color:var(--ok);font-weight:700">✓ Cupom ${esc(data.codigo)} aplicado: ${data.tipo === 'frete' ? 'entrega grátis' : data.tipo === 'percentual' ? Number(data.valor) + '% de desconto' : brl(data.valor) + ' de desconto'}</span>`;
    }
    renderPag(); updNext();
  };

  GP.moneyMask($('c-troco'));
  function trocoOk() {
    if ($('c-semtroco').checked) return true;
    const v = GP.num($('c-troco').value);
    return v > total();
  }
  function renderDin() {
    const on = pag === 'dinheiro';
    $('din-area').classList.toggle('hide', !on);
    if (!on) return;
    const sem = $('c-semtroco').checked, v = GP.num($('c-troco').value);
    $('c-troco').disabled = sem;
    $('troco-msg').innerHTML = sem ? '' : !v ? `Total do pedido: <b>${brl(total())}</b>` : v > total()
      ? `<span style="color:var(--ok);font-weight:700">✓ O motoboy leva ${brl(v - total())} de troco</span>`
      : `<span style="color:var(--bad);font-weight:700">⚠ Precisa ser maior que ${brl(total())}</span>`;
  }
  $('c-troco').addEventListener('input', () => { renderDin(); updNext(); });
  $('c-semtroco').addEventListener('change', () => { if ($('c-semtroco').checked) $('c-troco').value = ''; renderDin(); updNext(); });
  function renderPix() {
    renderDin();
    const on = pag === 'pix';
    $('pix-area').classList.toggle('hide', !on);
    if (!on) return;
    const v = total();
    const cc = GP.pixPayload(loja, v);
    $('pix-val').textContent = brl(v);
    $('pix-qr').innerHTML = cc ? GP.qr(cc) : '';
    $('pix-qr').style.display = cc ? '' : 'none';
    $('pix-copy-cc').style.display = cc ? '' : 'none';
    $('pix-copy-cc').onclick = () => GP.copy(cc, 'Código Pix copiado! Cole no app do seu banco.');
    const tipos = { cpf: 'CPF', cnpj: 'CNPJ', telefone: 'Telefone', email: 'E-mail', aleatoria: 'Chave aleatória' };
    $('pix-tipo').textContent = 'Chave Pix · ' + (tipos[loja.pix_tipo] || '');
    $('pix-key').textContent = loja.pix_chave || '—';
    $('pix-copy-key').onclick = () => GP.copy(GP.pixChave(loja.pix_tipo, loja.pix_chave), 'Chave Pix copiada!');
    $('pix-nome').innerHTML = loja.pix_nome ? `Recebedor: <b>${esc(loja.pix_nome)}</b>. Confira o nome antes de pagar.` : '';
    renderDrop();
  }
  function renderDrop(loading) {
    const d = $('pix-drop');
    d.classList.toggle('done', !!comprovante && !loading);
    if (loading) d.innerHTML = `<span class="ic"><span class="spin"></span></span><b>Enviando comprovante…</b>`;
    else if (comprovante) d.innerHTML = `<span class="ic">${ic('check')}</span><b>Comprovante anexado</b><span class="small">Toque para trocar o arquivo</span>`;
    else d.innerHTML = `<span class="ic">${ic('upload')}</span><b>Anexar comprovante do Pix</b><span class="small muted">Foto ou print da tela (JPG, PNG ou PDF)</span>`;
    $('pix-lock').innerHTML = comprovante ? '' : ic('shield') + 'O pedido só pode ser enviado depois de anexar o comprovante.';
  }
  $('pix-file').onchange = async (e) => {
    let f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    if (!/^image\/|application\/pdf/.test(f.type)) return GP.toast('Envie uma imagem ou PDF.', 'err');
    renderDrop(true); updNext(true);
    try {
      f = await GP.compress(f, 1600, 0.85);
      if (f.size > 8 * 1024 * 1024) throw new Error('Arquivo muito grande (máx. 8 MB).');
      const path = `${loja.id}/${GP.uid()}.${GP.ext(f)}`;
      const { error } = await sb.storage.from('ff-comprovantes').upload(path, f, { contentType: f.type, upsert: false });
      if (error) throw error;
      comprovante = path; comprovanteTotal = total();
      GP.toast('Comprovante anexado!', 'ok');
    } catch (er) { comprovante = null; GP.toast(GP.err(er), 'err'); }
    renderDrop(); updNext();
  };

  function updNext(busy) {
    const b = $('co-next');
    let ok = true, txt = 'Continuar';
    if (step === 1) {
      txt = `Continuar · ${brl(subtotal())}`;
      ok = count() > 0 && subtotal() >= Number(loja.pedido_minimo);
    } else if (step === 2) {
      const e = entrega();
      txt = 'Ir para o pagamento';
      ok = $('c-nome').value.trim().length >= 2 && GP.digits($('c-tel').value).length >= 10 && (modoEnt === 'retirada' || (addr && addr.valid() && e && !e.fora));
      if (e && e.calc) { ok = false; txt = 'Calculando a rota…'; }
      if (modoEnt === 'entrega' && addr && !addr.valid() && $('c-nome').value.trim()) txt = 'Preencha rua, número e cidade';
    } else {
      txt = `Enviar pedido · ${brl(total())}`;
      ok = !!pag && (pag !== 'pix' || !!comprovante) && (pag !== 'dinheiro' || trocoOk());
    }
    if (!ST().aberta) { ok = false; txt = 'Loja fechada no momento'; }
    b.textContent = txt;
    b.disabled = busy === true || (step === 2 && entrega() && entrega().calc);
    b.classList.toggle('is-off', !ok);
  }

  // O que está faltando no passo atual? -> { el, msg }
  function faltaCheckout() {
    const fA = (k) => $('c-addr').querySelector(`[id$="-${k}"]`);
    if (!ST().aberta) return { msg: ST().texto + '. Os pedidos estão pausados.' };
    if (step === 1) {
      if (!count()) return { msg: 'Sua sacola está vazia. Escolha algo no cardápio.' };
      const f = Number(loja.pedido_minimo) - subtotal();
      if (f > 0) return { el: $('s1-min'), msg: `Pedido mínimo de ${brl(loja.pedido_minimo)}. Faltam ${brl(f)}.` };
      return null;
    }
    if (step === 2) {
      if ($('c-nome').value.trim().length < 2) return { el: $('c-nome'), msg: 'Digite seu nome.' };
      if (GP.digits($('c-tel').value).length < 10) return { el: $('c-tel'), msg: 'Digite seu WhatsApp com DDD.' };
      if (modoEnt === 'retirada') return null;
      if (!addr) return null;
      const a = addr.get();
      if (a.rua.length < 3) return { el: fA('rua'), msg: 'Preencha a rua (ou digite o CEP).' };
      if (!a.numero) return { el: fA('numero'), msg: 'Preencha o número da casa.' };
      if (a.cidade.length < 2) return { el: fA('cidade'), msg: 'Preencha a cidade.' };
      if (!addr.pos) return { el: $('c-addr').querySelector('.map'), msg: 'Marque sua localização no mapa (toque no mapa ou em "Minha localização").' };
      const e = entrega();
      if (e && e.calc) return { el: $('c-fee'), msg: 'Aguarde, calculando a rota…' };
      if (e && e.fora) return { el: $('c-fee'), msg: 'Esse endereço está fora da área de entrega da loja.' };
      return null;
    }
    if (!pag) return { el: $('pay-opts'), msg: 'Escolha a forma de pagamento.' };
    if (pag === 'pix' && !comprovante) return { el: $('pix-drop'), msg: 'Pague o Pix e anexe o comprovante para enviar o pedido.' };
    if (pag === 'dinheiro' && !trocoOk()) return { el: $('c-troco'), msg: `Informe o troco (maior que ${brl(total())}) ou marque "Não preciso de troco".` };
    return null;
  }
  function avisar(f) {
    GP.toast(f.msg, 'err');
    if (!f.el) return;
    f.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const alvo = f.el.closest('.field, .opt, .drop, .fee, .map, #pay-opts') || f.el;
    alvo.classList.remove('need'); void alvo.offsetWidth; alvo.classList.add('need');
    setTimeout(() => alvo.classList.remove('need'), 2200);
    if (f.el.matches('input, textarea')) setTimeout(() => f.el.focus({ preventScroll: true }), 350);
  }

  $('co-next').onclick = async () => {
    const f = faltaCheckout();
    if (f) return avisar(f);
    if (step < 3) {
      if (step === 2 && modoEnt === 'entrega') {
        const a = addr.get();
        GP.ls.set('gp_cliente', { nome: $('c-nome').value.trim(), telefone: $('c-tel').value.trim(), end: a, lat: pos.lat, lng: pos.lng });
      } else if (step === 2) GP.ls.set('gp_cliente', { ...(GP.ls.get('gp_cliente', {}) || {}), nome: $('c-nome').value.trim(), telefone: $('c-tel').value.trim() });
      step++; renderStep(); return;
    }
    const b = $('co-next'); b.disabled = true; b.innerHTML = '<span class="spin"></span>Enviando pedido…';
    const { data, error } = await sb.rpc('ff_criar_pedido', {
      p_loja: loja.id,
      p_cliente: Object.assign({ cupom: cupom ? cupom.codigo : '', troco_para: pag === 'dinheiro' && !$('c-semtroco').checked ? GP.num($('c-troco').value) : null, nome: $('c-nome').value.trim(), telefone: $('c-tel').value.trim(), observacao: $('c-obs').value.trim(), tipo: modoEnt },
        modoEnt === 'entrega' ? { endereco: GP.fmtEnd(addr.get()), complemento: addr.get().complemento, lat: pos.lat, lng: pos.lng, distancia_km: entrega() ? entrega().d : null } : {}),
      p_itens: bag.map(i => ({ id: i.id, qtd: i.qtd, obs: i.obs, opcoes: i.opcoes || [] })),
      p_pagamento: pag,
      p_comprovante: pag === 'pix' ? comprovante : null
    });
    if (error) { GP.toast(GP.err(error), 'err'); updNext(); return; }
    bag = []; GP.ls.del(KEY);
    if (user) {
      try {
        const nome = $('c-nome').value.trim(), telefone = $('c-tel').value.trim();
        await sb.from('ff_clientes').upsert({ id: user.id, nome: (perfil && perfil.nome) || nome, telefone: (perfil && perfil.telefone) || telefone });
        if (modoEnt === 'entrega' && !endSel && $('c-save').checked) {
          const a = addr.get();
          await sb.from('ff_enderecos').insert({ apelido: enderecos.length ? '' : 'Casa', cep: a.cep, rua: a.rua, numero: a.numero, bairro: a.bairro, cidade: a.cidade, uf: a.uf, complemento: a.complemento, lat: a.lat, lng: a.lng, principal: !enderecos.length });
        }
      } catch {}
    }
    const hist = GP.ls.get('gp_pedidos', []); hist.unshift({ t: data.token, n: data.numero, loja: loja.nome, em: Date.now() });
    GP.ls.set('gp_pedidos', hist.slice(0, 20));
    location.href = 'pedido.html?t=' + encodeURIComponent(data.token) + '&novo=1';
  };

  // ---------- Avaliações ----------
  (async () => {
    const { data } = await sb.rpc('ff_avaliacoes_loja', { p_loja: loja.id, p_limite: 20 });
    const lst = data || [];
    const quando = (d) => { const dd = Math.floor((Date.now() - new Date(d)) / 864e5); return dd < 1 ? 'hoje' : dd === 1 ? 'ontem' : dd < 30 ? `há ${dd} dias` : new Date(d).toLocaleDateString('pt-BR'); };
    if (!lst.length) {
      $('revs').innerHTML = `<div class="card rnew"><span class="big">⭐</span><div><b class="small" style="display:block">Ainda sem avaliações</b><span class="small muted">Peça e seja o primeiro a avaliar esta loja.</span></div></div>`;
      $('reviews').innerHTML = ''; return;
    }
    const comTexto = lst.filter(a => a.comentario).concat(lst.filter(a => !a.comentario)).slice(0, 10);
    $('revs').innerHTML = `<div class="revs-h"><h2>Avaliações</h2><span class="small"><span class="stars">★</span> <b>${(Number(loja.nota_media) || lst.reduce((a, r) => a + r.nota, 0) / lst.length).toFixed(1).replace('.', ',')}</b> <span class="muted">· ${loja.nota_qtd || lst.length} avaliaç${(loja.nota_qtd || lst.length) === 1 ? 'ão' : 'ões'}</span></span><a href="#reviews">Ver todas</a></div>
      <div class="revs-row">${comTexto.map(a => `<div class="card rcard"><div class="top"><span class="av">${esc((a.nome || 'C').trim()[0].toUpperCase())}</span><div style="min-width:0"><div class="nm">${esc(a.nome || 'Cliente')}</div><div class="dt">${quando(a.criado_em)}</div></div><span style="margin-left:auto">${GP.estrelas(a.nota)}</span></div>${a.comentario ? `<p>${esc(a.comentario)}</p>` : '<p class="muted">Sem comentário.</p>'}</div>`).join('')}</div>`;
    const dist = [5, 4, 3, 2, 1].map(n => lst.filter(a => a.nota === n).length);
    $('reviews').innerHTML = `<div class="card pad">
      <div class="row" style="gap:16px;flex-wrap:wrap"><div class="center"><div style="font-size:2.2rem;font-weight:800;letter-spacing:-.03em">${String(loja.nota_media || '').replace('.', ',')}</div>${GP.estrelas(loja.nota_media)}<div class="small muted">${loja.nota_qtd} avaliações</div></div>
        <div class="grow" style="min-width:160px">${[5, 4, 3, 2, 1].map((n, i) => `<div class="row small" style="gap:8px"><span style="width:12px">${n}</span><span style="flex:1;height:6px;background:#ECEAE6;border-radius:9px;overflow:hidden"><i style="display:block;height:100%;width:${lst.length ? dist[i] / lst.length * 100 : 0}%;background:#F5A623"></i></span></div>`).join('')}</div></div>
      <div class="divider"></div>
      ${lst.map(a => `<div class="rev"><div class="row between"><b class="small">${esc(a.nome || 'Cliente')}</b><span class="small muted">${new Date(a.criado_em).toLocaleDateString('pt-BR')}</span></div>
        ${GP.estrelas(a.nota)}${a.comentario ? `<p class="small" style="margin-top:4px">${esc(a.comentario)}</p>` : ''}
        ${a.resposta ? `<div class="resp"><b>Resposta da loja:</b> ${esc(a.resposta)}</div>` : ''}</div>`).join('')}
    </div>`;
    $('reviews').insertAdjacentHTML('afterbegin', '<h2 style="font-size:1.15rem;font-weight:800;margin-bottom:12px">Avaliações dos clientes</h2>');
  })();

  // ---------- Denúncia ----------
  $('b-denuncia').onclick = () => {
    const w = document.createElement('div');
    w.className = 'cfm-wrap';
    w.innerHTML = `<div class="cfm" style="text-align:left"><div class="cfm-ic bad" style="margin-left:0">${ic('shield')}</div>
      <h3>Denunciar ${esc(loja.nome)}</h3><p>A equipe do GoPedido vai analisar. Se for golpe, a loja é bloqueada.</p>
      <label class="field" style="margin-top:12px"><span>Motivo</span><select class="input" id="dn-m"><option>Pedi e não recebi</option><option>Loja falsa / golpe</option><option>Cobrança errada</option><option>Produto diferente do anunciado</option><option>Outro</option></select></label>
      <label class="field"><span>Conte o que aconteceu</span><textarea class="input" id="dn-d" maxlength="1000" style="min-height:80px"></textarea></label>
      <label class="field"><span>Seu WhatsApp <span class="muted">(opcional, para retorno)</span></span><input class="input" id="dn-c" inputmode="tel" maxlength="30"></label>
      <div class="field"><span>Comprovante de pagamento <span class="muted">(opcional)</span></span>
        <label class="drop" id="dn-drop" style="min-height:0;padding:12px"><input type="file" id="dn-f" accept="image/*,application/pdf" hidden><span class="ic">${ic('upload')}</span><b>Anexar comprovante</b><span class="small muted">Print do Pix ou da cobrança (JPG, PNG ou PDF)</span></label></div>
      <div class="cfm-acts"><button type="button" class="btn btn-ghost" data-r="0">Voltar</button><button type="button" class="btn btn-danger" data-r="1">Enviar denúncia</button></div></div>`;
    document.body.appendChild(w); requestAnimationFrame(() => w.classList.add('on'));
    const fim = () => { w.classList.remove('on'); setTimeout(() => w.remove(), 180); };
    let dnComp = null, dnEnviando = false;
    const dnDrop = w.querySelector('#dn-drop');
    const dnRender = (txt) => {
      dnDrop.classList.toggle('done', !!dnComp && !dnEnviando);
      dnDrop.querySelector('.ic').innerHTML = dnEnviando ? '<span class="spin"></span>' : ic(dnComp ? 'check' : 'upload');
      dnDrop.querySelector('b').textContent = dnEnviando ? 'Enviando…' : dnComp ? 'Comprovante anexado' : 'Anexar comprovante';
      dnDrop.querySelector('.small').textContent = txt || (dnComp ? 'Toque para trocar o arquivo' : 'Print do Pix ou da cobrança (JPG, PNG ou PDF)');
    };
    w.querySelector('#dn-f').onchange = async (e) => {
      let f = e.target.files[0]; e.target.value = '';
      if (!f) return;
      if (!/^image\/|application\/pdf/.test(f.type)) return GP.toast('Envie uma imagem ou PDF.', 'err');
      dnEnviando = true; dnRender();
      try {
        f = await GP.compress(f, 1600, 0.85);
        if (f.size > 8 * 1024 * 1024) throw new Error('Arquivo muito grande (máx. 8 MB).');
        const path = `denuncias/${loja.id}/${GP.uid()}.${GP.ext(f)}`;
        const { error } = await sb.storage.from('ff-comprovantes').upload(path, f, { contentType: f.type, upsert: false });
        if (error) throw error;
        dnComp = path;
      } catch (er) { dnComp = null; GP.toast(GP.err(er), 'err'); }
      dnEnviando = false; dnRender(dnComp ? f.name : '');
    };
    w.addEventListener('click', async (e) => {
      if (e.target === w || e.target.closest('[data-r="0"]')) return fim();
      const bt = e.target.closest('[data-r="1"]');
      if (!bt) return;
      if (dnEnviando) return GP.toast('Espere o comprovante terminar de enviar.');
      bt.disabled = true;
      const { error } = await sb.rpc('ff_denunciar', { p_loja: loja.id, p_motivo: w.querySelector('#dn-m').value, p_detalhe: w.querySelector('#dn-d').value, p_contato: w.querySelector('#dn-c').value, p_comprovante: dnComp });
      bt.disabled = false;
      if (error) return GP.toast(GP.err(error), 'err');
      fim(); GP.toast('Denúncia enviada. Obrigado por avisar!', 'ok');
    });
  };

  saveBag();
  renderTickets();
})();
</script>
</body>
</html>
