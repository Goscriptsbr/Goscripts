<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar com Google — Sinucou</title>
<meta name="robots" content="noindex">
<style>:root{--bg:#06101c;--card:#0d1a2b;--gold:#f4c542;--txt:#e9eef5;--mut:#9fb0c4;--line:#1d2f47}
*{box-sizing:border-box}html{background:#06101c}body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 20% -10%,#123a2a 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#13294d 0,transparent 55%),var(--bg);color:var(--txt);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:40px 20px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.ball{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#555,#000 70%);display:grid;place-items:center;box-shadow:0 0 0 3px var(--gold)}
.ball span{background:#fff;color:#000;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-weight:800;font-size:14px}
h1{margin:0;font-size:28px;color:var(--gold);letter-spacing:.5px}
.sub{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin:16px 0}
h2{font-size:19px;margin:0 0 8px;color:#fff}
ul{padding-left:20px;margin:6px 0}li{margin:4px 0}
a{color:#7fc4ff}code{background:#071321;padding:1px 6px;border-radius:6px}
.btn{display:inline-block;background:var(--gold);color:#241800;font-weight:700;text-decoration:none;padding:12px 20px;border-radius:12px;margin-top:6px}
footer{margin-top:34px;color:var(--mut);font-size:13px;text-align:center}
footer a{color:var(--gold);text-decoration:none;font-weight:600}
.box{text-align:center;padding:30px 22px}
#gbtn{display:flex;justify-content:center;margin:22px 0 8px;min-height:48px}
#msg{font-size:17px;margin-top:14px}
.ok{color:#3ddc84}.err{color:#ff8a6a}
.big{font-size:54px;margin:4px 0}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head><body><div class="wrap">
<header><div class="ball"><span>8</span></div><div><h1 id="tt">Conectar com Google</h1><div class="sub">Sinucou: Sinuca e Truco</div></div></header>
<div class="card box">
<div class="big" id="ico">🔒</div>
<p id="lead">Escolha a sua conta Google para guardar seu progresso do Sinucou nela.</p>
<div id="gbtn"></div>
<div id="msg"></div>
<p class="sub" style="margin-top:18px">Usamos só a identificação da sua conta Google para achar seu progresso. Não lemos seus e-mails nem seus contatos. <a href="../privacidade/">Privacidade</a></p>
</div>
<footer>Desenvolvido por <a href="https://goscripts.com.br">GoScripts</a> · <a href="../termos/">Termos de Uso</a></footer>
</div>
<script>
const SRV = "https://sinucou.onrender.com";
const q = new URLSearchParams(location.search);
const n = q.get("n") || "", mode = q.get("m") || "link";
const msg = document.getElementById("msg");
function say(t, cls){ msg.className = cls || ""; msg.textContent = t; }
if (mode === "login") {
  document.getElementById("tt").textContent = "Entrar com Google";
  document.getElementById("lead").textContent = "Escolha a conta Google que você ligou ao Sinucou para trazer suas moedas, itens e progresso.";
}
async function onCred(r){
  say("Conferindo sua conta...", "");
  try {
    const res = await fetch(SRV + "/glink", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ n, cred: r.credential }) });
    const j = await res.json();
    say(j.msg || (j.ok ? "Pronto!" : "Deu erro, tente de novo."), j.ok ? "ok" : "err");
    document.getElementById("ico").textContent = j.ok ? "✅" : "⚠️";
    if (j.ok) document.getElementById("gbtn").style.display = "none";
  } catch (e) { say("Sem conexão com o servidor do jogo. Tente de novo.", "err"); }
}
async function start(){
  if (!n) { say("Abra esta página pelo botão do Google dentro do jogo.", "err"); return; }
  let cid = "";
  try { cid = (await (await fetch(SRV + "/gconfig")).json()).client_id; } catch (e) {}
  if (!cid) { say("O login com Google ainda está sendo ativado. Tente mais tarde.", "err"); return; }
  const wait = () => { if (!window.google || !google.accounts) return setTimeout(wait, 100);
    google.accounts.id.initialize({ client_id: cid, callback: onCred, ux_mode: "popup", auto_select: false });
    google.accounts.id.renderButton(document.getElementById("gbtn"), { theme: "filled_blue", size: "large", text: mode === "login" ? "signin_with" : "continue_with", shape: "pill", locale: "pt-BR" });
  }; wait();
}
start();
</script>
</body></html>
